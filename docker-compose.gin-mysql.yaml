# Select with COMPOSE_FILE=docker-compose.gin.yaml:docker-compose.gin-mysql.yaml
# (use ';' as the COMPOSE_FILE separator on Windows).
services:
  web:
    environment:
      DB_TYPE: mysql
      MYSQL_HOST: mysql
    depends_on:
      mysql: {condition: service_healthy}
  mysql:
    image: mysql:8.4.11
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-office_automation}
      MYSQL_USER: ${MYSQL_USER:-media_admin}
      MYSQL_PASSWORD_FILE: /run/frontiercloud-secrets/mysql_password
      MYSQL_ROOT_PASSWORD_FILE: /run/frontiercloud-secrets/mysql_root_password
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
      - runtime_secrets:/run/frontiercloud-secrets:ro
    depends_on:
      secrets-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD-SHELL, "MYSQL_PWD=$$(cat /run/frontiercloud-secrets/mysql_password) mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  mysql_data:
