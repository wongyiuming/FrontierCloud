services:
  web:
    build: .
    container_name: office_automation_web
    restart: always
    env_file: .env
    environment:
      ADMIN_BOOTSTRAP_TOKEN: ${ADMIN_BOOTSTRAP_TOKEN:?ADMIN_BOOTSTRAP_TOKEN must be set}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      PYTHONDONTWRITEBYTECODE: "1"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    volumes:
      - ./data:/app/data:z
      - web_tmp:/tmp
    healthcheck:
      test: ["CMD", "python", "-m", "app.services.health_probe"]
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: office_automation_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mysql:
    image: mysql:8.4
    container_name: office_automation_mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-office_automation}
      MYSQL_USER: ${MYSQL_USER:-media_admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
      - mysql_socket:/var/run/mysqld
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mysql_monitoring_init:
    image: mysql:8.4
    container_name: frontiercloud_mysql_monitoring_init
    restart: "no"
    user: mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-office_automation}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      MYSQL_EXPORTER_USER: ${MYSQL_EXPORTER_USER:-frontiercloud_exporter}
      MYSQL_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?MYSQL_EXPORTER_PASSWORD must be set}
      MYSQL_BACKUP_USER: ${MYSQL_BACKUP_USER:-frontiercloud_backup}
      MYSQL_BACKUP_PASSWORD: ${MYSQL_BACKUP_PASSWORD:?MYSQL_BACKUP_PASSWORD must be set}
    entrypoint:
      - /bin/sh
      - /opt/frontiercloud/mysql_monitoring_init.sh
    volumes:
      - ./monitoring/mysql_monitoring_init.sh:/opt/frontiercloud/mysql_monitoring_init.sh:ro
      - mysql_socket:/var/run/mysqld
    depends_on:
      mysql:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=8m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: office_automation_nginx
    restart: always
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - SERVER_NAME=${SERVER_NAME:?SERVER_NAME must be set}
      - MONITORING_ALLOW_CIDR=${MONITORING_ALLOW_CIDR:?MONITORING_ALLOW_CIDR must be set}
      - MONITORING_SELF_ALLOW_CIDR=${MONITORING_SELF_ALLOW_CIDR:-127.0.0.1/32}
      - METRICS_BASIC_USER=${METRICS_BASIC_USER:?METRICS_BASIC_USER must be set}
      - METRICS_BASIC_PASSWORD=${METRICS_BASIC_PASSWORD:?METRICS_BASIC_PASSWORD must be set}
      - INTERNAL_METRICS_TOKEN=${INTERNAL_METRICS_TOKEN:?INTERNAL_METRICS_TOKEN must be set}
      - UPLOAD_INACTIVITY_TIMEOUT=${ADMIN_UPLOAD_INACTIVITY_TIMEOUT:-300}
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./data:/app/data:ro,z
      - nginx_logs:/var/log/nginx
      - ${SSL_CERT_PATH:-./certs/fullchain.pem}:/etc/nginx/certs/fullchain.pem:ro
      - ${SSL_KEY_PATH:-./certs/privkey.pem}:/etc/nginx/certs/privkey.pem:ro
      - ${ACME_WEBROOT:-./certs/acme}:/var/www/certbot:ro
    depends_on:
      web:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  stun:
    image: coturn/coturn:4.17.2-r0-alpine
    container_name: frontiercloud_stun
    restart: always
    command:
      - -n
      - --stun-only
      - --no-auth
      - --no-cli
      - --no-tls
      - --no-dtls
      - --fingerprint
      - --no-multicast-peers
      - --log-file=stdout
      - --simple-log
      - --listening-port=3478
    ports:
      - "${WEBRTC_STUN_PORT:-3478}:3478/tcp"
      - "${WEBRTC_STUN_PORT:-3478}:3478/udp"
    read_only: true
    tmpfs:
      - /tmp:size=4m,mode=1777
      - /var/lib/coturn:size=4m,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 32m
    cpus: "0.20"
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  node_exporter:
    image: prom/node-exporter:v1.9.1
    container_name: frontiercloud_node_exporter
    restart: always
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.textfile.directory=/textfile
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containers/storage/.+)($|/)
    expose:
      - "9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
      - backup_metrics:/textfile:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    logging: &exporter_logging
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  cadvisor:
    image: ghcr.io/google/cadvisor:0.56.2
    container_name: frontiercloud_cadvisor
    restart: always
    command:
      # Docker 29 uses the containerd overlayfs image store. Disabling only
      # per-container disk discovery preserves CPU, memory and network metrics.
      - --disable_metrics=disk
    expose:
      - "8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    devices:
      - /dev/kmsg:/dev/kmsg
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    logging: *exporter_logging

  redis_exporter:
    image: oliver006/redis_exporter:v1.89.0-alpine
    container_name: frontiercloud_redis_exporter
    restart: always
    environment:
      REDIS_ADDR: redis://redis:6379
    expose:
      - "9121"
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 64m
    logging: *exporter_logging

  mysql_exporter:
    image: prom/mysqld-exporter:v0.19.0
    container_name: frontiercloud_mysql_exporter
    restart: always
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?MYSQL_EXPORTER_PASSWORD must be set}
    command:
      - --mysqld.address=mysql:3306
      - --mysqld.username=${MYSQL_EXPORTER_USER:-frontiercloud_exporter}
    expose:
      - "9104"
    depends_on:
      mysql_monitoring_init:
        condition: service_completed_successfully
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    logging: *exporter_logging

  nginx_exporter:
    image: nginx/nginx-prometheus-exporter:1.5.1
    container_name: frontiercloud_nginx_exporter
    restart: always
    command:
      - --nginx.scrape-uri=http://nginx:8080/stub_status
    expose:
      - "9113"
    depends_on:
      - nginx
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 64m
    logging: *exporter_logging

  nginxlog_exporter:
    image: quay.io/martinhelmich/prometheus-nginxlog-exporter:v1.11.0
    container_name: frontiercloud_nginxlog_exporter
    restart: always
    command:
      - -config-file
      - /etc/prometheus-nginxlog-exporter.hcl
    expose:
      - "4040"
    volumes:
      - nginx_logs:/mnt/nginxlogs:ro
      - ./monitoring/nginxlog-exporter.hcl:/etc/prometheus-nginxlog-exporter.hcl:ro
    depends_on:
      - nginx
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    logging: *exporter_logging

  nginxlog_limiter:
    image: busybox:1.37.0
    container_name: frontiercloud_nginxlog_limiter
    restart: always
    environment:
      NGINX_METRIC_LOG_MAX_BYTES: ${NGINX_METRIC_LOG_MAX_BYTES:-10485760}
    entrypoint:
      - /bin/sh
      - /opt/frontiercloud/nginx_log_limiter.sh
    volumes:
      - nginx_logs:/mnt/nginxlogs
      - ./monitoring/nginx_log_limiter.sh:/opt/frontiercloud/nginx_log_limiter.sh:ro
    depends_on:
      - nginx
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 32m
    logging: *exporter_logging

  mysql_backup:
    profiles: ["monitoring"]
    image: mysql:8.4
    container_name: frontiercloud_mysql_backup
    restart: always
    environment:
      MYSQL_PWD: ${MYSQL_BACKUP_PASSWORD:?MYSQL_BACKUP_PASSWORD must be set}
      MYSQL_BACKUP_USER: ${MYSQL_BACKUP_USER:-frontiercloud_backup}
    entrypoint:
      - /bin/sh
      - /opt/frontiercloud/mysql_backup.sh
    volumes:
      - ./monitoring/mysql_backup.sh:/opt/frontiercloud/mysql_backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups:z
      - backup_metrics:/textfile
    depends_on:
      mysql_monitoring_init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    logging: *exporter_logging

volumes:
  web_tmp:
  redis_data:
  mysql_data:
  mysql_socket:
  nginx_logs:
  backup_metrics:
