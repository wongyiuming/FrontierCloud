user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access_log.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    limit_req_zone $binary_remote_addr zone=watermark_per_ip:10m rate=10r/m;
    limit_req_status 429;
    # FastAPI enforces an 800 MiB file limit; multipart framing needs headroom.
    # Multi-file and folder tasks use one request per file for exact progress.
    client_max_body_size 820M;
    client_body_timeout 1800s;
    resolver 127.0.0.11 ipv6=off valid=30s;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        return 444;
    }

    # Docker-internal Nginx status source. It is not published by Compose and
    # is consumed only by nginx-prometheus-exporter on the private network.
    server {
        listen 8080;
        server_name _;
        location = /stub_status {
            stub_status;
            access_log off;
        }
        location / { return 404; }
    }

    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name _;
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        return 444;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name ${SERVER_NAME};
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name ${SERVER_NAME};

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location = /internal/metrics/app {
            allow ${MONITORING_ALLOW_CIDR};
            deny all;
            auth_basic "FrontierCloud metrics";
            auth_basic_user_file /run/frontiercloud/metrics.htpasswd;
            proxy_pass http://web:8000/internal/metrics;
            proxy_set_header X-Metrics-Token "${INTERNAL_METRICS_TOKEN}";
            proxy_set_header Authorization "";
        }

        location = /internal/metrics/node {
            allow ${MONITORING_ALLOW_CIDR};
            deny all;
            auth_basic "FrontierCloud metrics";
            auth_basic_user_file /run/frontiercloud/metrics.htpasswd;
            set $metrics_node_upstream http://node_exporter:9100/metrics;
            proxy_pass $metrics_node_upstream;
            proxy_set_header Authorization "";
        }

        location = /internal/metrics/cadvisor {
            allow ${MONITORING_ALLOW_CIDR};
            deny all;
            auth_basic "FrontierCloud metrics";
            auth_basic_user_file /run/frontiercloud/metrics.htpasswd;
            set $metrics_cadvisor_upstream http://cadvisor:8080/metrics;
            proxy_pass $metrics_cadvisor_upstream;
            proxy_set_header Authorization "";
        }

        location = /internal/metrics/redis {
            allow ${MONITORING_ALLOW_CIDR};
            deny all;
            auth_basic "FrontierCloud metrics";
            auth_basic_user_file /run/frontiercloud/metrics.htpasswd;
            set $metrics_redis_upstream http://redis_exporter:9121/metrics;
            proxy_pass $metrics_redis_upstream;
            proxy_set_header Authorization "";
        }

        location = /internal/metrics/mysql {
            allow ${MONITORING_ALLOW_CIDR};
            deny all;
            auth_basic "FrontierCloud metrics";
            auth_basic_user_file /run/frontiercloud/metrics.htpasswd;
            set $metrics_mysql_upstream http://mysql_exporter:9104/metrics;
            proxy_pass $metrics_mysql_upstream;
            proxy_set_header Authorization "";
        }

        location = /internal/metrics/nginx {
            allow ${MONITORING_ALLOW_CIDR};
            deny all;
            auth_basic "FrontierCloud metrics";
            auth_basic_user_file /run/frontiercloud/metrics.htpasswd;
            set $metrics_nginx_upstream http://nginx_exporter:9113/metrics;
            proxy_pass $metrics_nginx_upstream;
            proxy_set_header Authorization "";
        }

        location = /internal/metrics/nginxlog {
            allow ${MONITORING_ALLOW_CIDR};
            deny all;
            auth_basic "FrontierCloud metrics";
            auth_basic_user_file /run/frontiercloud/metrics.htpasswd;
            set $metrics_nginxlog_upstream http://nginxlog_exporter:4040/metrics;
            proxy_pass $metrics_nginxlog_upstream;
            proxy_set_header Authorization "";
        }

        # Admin assets change with application behavior and must never remain on
        # an old JavaScript implementation after a deployment.
        location = /static/js/admin.js {
            alias /app/static/js/admin.js;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        location = /static/css/admin.css {
            alias /app/static/css/admin.css;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        location /static/ {
            alias /app/static/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # FastAPI authorizes the admin request and then delegates the file body
        # to Nginx. `internal` prevents bypassing the admin session check.
        location ^~ /_protected_media/ {
            internal;
            alias /app/data/media/;
            sendfile on;
            tcp_nopush on;
            add_header Cache-Control "private, no-store" always;
        }

        location = /api/v1/watermark {
            client_max_body_size 66M;
            limit_req zone=watermark_per_ip burst=2 nodelay;
            proxy_pass http://web:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /api/v1/media/admin/ {
            proxy_pass http://web:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;
            add_header Cache-Control "no-store" always;
        }

        location / {
            proxy_pass http://web:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
