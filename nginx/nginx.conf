user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    geo $remote_addr $security_blocked {
        default 0;
        include /etc/nginx/runtime/ip-security.conf;
    }
    map $upstream_addr $logged_upstream_addr {
        "" "-";
        default $upstream_addr;
    }
    map $http_traceparent $trace_id {
        "~^[0-9a-f]{2}-([0-9a-f]{32})-" $1;
        default "";
    }
    map $uri $access_loggable {
        default 1;
        ~^/health(?:/|$) 0;
        =/metrics 0;
    }
    map $uri $logged_path {
        default $uri;
        ~^/_relay_media/ /api/v1/media/stream;
    }
    map $scheme $frontiercloud_hsts {
        default "";
        https "max-age=31536000";
    }

    log_format structured escape=json
        '{"timestamp":"$time_iso8601","level":"INFO","component":"nginx",'
        '"instance":"${INSTANCE_NAME}","request_id":"$request_id",'
        '"trace_id":"$trace_id","client_ip":"$remote_addr",'
        '"method":"$request_method","path":"$logged_path","status":$status,'
        '"duration_seconds":$request_time,"bytes_sent":$body_bytes_sent,'
        '"security_blocked":$security_blocked,"upstream_addr":"$logged_upstream_addr"}';
    access_log /dev/stdout structured if=$access_loggable;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    limit_req_status 429;
    client_body_timeout ${UPLOAD_INACTIVITY_TIMEOUT}s;

    include /etc/nginx/runtime/extra-servers.conf;

    server {
        include /etc/nginx/runtime/public-listen.conf;
        server_name ${SERVER_NAME};
        include /etc/nginx/runtime/public-tls.conf;
        if ($security_blocked) { return 403; }
        client_max_body_size 64k;
        include /etc/nginx/security-headers.conf;

        location = /static/js/admin.js { alias /app/static/js/admin.js; expires -1; add_header Cache-Control "no-store, no-cache, must-revalidate" always; include /etc/nginx/security-headers.conf; }
        location = /static/css/admin.css { alias /app/static/css/admin.css; expires -1; add_header Cache-Control "no-store, no-cache, must-revalidate" always; include /etc/nginx/security-headers.conf; }
        location = /static/js/player.js { alias /app/static/js/player.js; expires -1; add_header Cache-Control "no-store, no-cache, must-revalidate" always; include /etc/nginx/security-headers.conf; }
        location = /static/css/player.css { alias /app/static/css/player.css; expires -1; add_header Cache-Control "no-store, no-cache, must-revalidate" always; include /etc/nginx/security-headers.conf; }
        location = /static/js/network-observation.js { alias /app/static/js/network-observation.js; expires -1; add_header Cache-Control "no-store, no-cache, must-revalidate" always; include /etc/nginx/security-headers.conf; }
        location /static/ { alias /app/static/; expires 30d; add_header Cache-Control "public, no-transform"; include /etc/nginx/security-headers.conf; }

        location ^~ /_protected_media/ {
            internal;
            alias /app/data/media/;
            sendfile on;
            tcp_nopush on;
            include /etc/nginx/security-headers.conf;
        }

        location ~ "^/_relay_media/(?<relay_host>[a-z0-9.-]+)/(?<relay_port>[0-9]{1,5})/(?<relay_object>[a-f0-9]{64})/(?<relay_token>[A-Za-z0-9_.-]+)$" {
            internal;
            resolver 127.0.0.11 valid=30s ipv6=off;
            proxy_pass https://$relay_host:$relay_port/internal/v1/media/$relay_object?token=$relay_token;
            proxy_ssl_server_name on;
            proxy_ssl_name $relay_host;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 4;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_set_header Host $relay_host:$relay_port;
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Real-IP "";
            proxy_set_header Connection "";
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_max_temp_file_size 0;
            proxy_request_buffering off;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_next_upstream off;
            proxy_intercept_errors on;
            error_page 301 302 303 307 308 =502 /_relay_failure;
            proxy_hide_header Set-Cookie;
            proxy_hide_header X-Accel-Redirect;
            proxy_ignore_headers X-Accel-Redirect;
            add_header Cache-Control "no-store" always;
            include /etc/nginx/security-headers.conf;
        }
        location = /_relay_failure { internal; return 502; }

        location /api/v1/media/admin/ {
            proxy_pass http://web:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_read_timeout ${UPLOAD_INACTIVITY_TIMEOUT}s;
            proxy_send_timeout ${UPLOAD_INACTIVITY_TIMEOUT}s;
            add_header Cache-Control "no-store" always;
            include /etc/nginx/security-headers.conf;
        }

        location /api/v1/media/admin/upload/ {
            client_max_body_size 820M;
            proxy_pass http://web:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_read_timeout ${UPLOAD_INACTIVITY_TIMEOUT}s;
            proxy_send_timeout ${UPLOAD_INACTIVITY_TIMEOUT}s;
            add_header Cache-Control "no-store" always;
            include /etc/nginx/security-headers.conf;
        }

        location / {
            proxy_pass http://web:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
