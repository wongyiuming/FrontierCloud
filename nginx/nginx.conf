user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access_log.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    limit_req_status 429;
    # FastAPI enforces an 800 MiB file limit; multipart framing needs headroom.
    # Multi-file and folder tasks use one request per file for exact progress.
    client_max_body_size 820M;
    client_body_timeout ${UPLOAD_INACTIVITY_TIMEOUT}s;
    resolver 127.0.0.11 ipv6=off valid=30s;

    # Generated at container startup from ENVIRONMENT. Production installs
    # HTTP/HTTPS catch-all servers plus the HTTP-to-HTTPS redirect;
    # development leaves this file empty and serves the app directly on HTTP.
    include /etc/nginx/runtime/environment-servers.conf;

    # Docker-internal Nginx status source. It is not published by Compose and
    # is consumed only by nginx-prometheus-exporter on the private network.
    server {
        listen 8080;
        server_name _;
        location = /stub_status {
            stub_status;
            access_log off;
        }
        location / { return 404; }
    }

    server {
        include /etc/nginx/runtime/public-listen.conf;
        server_name ${SERVER_NAME};

        include /etc/nginx/runtime/public-tls.conf;
        include /etc/nginx/server.d/*.conf;

        location = /internal/metrics/app {
            allow ${MONITORING_ALLOW_CIDR};
            allow ${MONITORING_SELF_ALLOW_CIDR};
            deny all;
            auth_basic "FrontierCloud metrics";
            auth_basic_user_file /run/frontiercloud/metrics.htpasswd;
            proxy_pass http://web:8000/internal/metrics;
            proxy_set_header X-Metrics-Token "${INTERNAL_METRICS_TOKEN}";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization "";
        }

        location = /internal/metrics/node {
            allow ${MONITORING_ALLOW_CIDR};
            allow ${MONITORING_SELF_ALLOW_CIDR};
            deny all;
            auth_basic "FrontierCloud metrics";
            auth_basic_user_file /run/frontiercloud/metrics.htpasswd;
            set $metrics_node_upstream http://node_exporter:9100/metrics;
            proxy_pass $metrics_node_upstream;
            proxy_set_header Authorization "";
        }

        location = /internal/metrics/cadvisor {
            allow ${MONITORING_ALLOW_CIDR};
            allow ${MONITORING_SELF_ALLOW_CIDR};
            deny all;
            auth_basic "FrontierCloud metrics";
            auth_basic_user_file /run/frontiercloud/metrics.htpasswd;
            set $metrics_cadvisor_upstream http://cadvisor:8080/metrics;
            proxy_pass $metrics_cadvisor_upstream;
            proxy_set_header Authorization "";
        }

        location = /internal/metrics/redis {
            allow ${MONITORING_ALLOW_CIDR};
            allow ${MONITORING_SELF_ALLOW_CIDR};
            deny all;
            auth_basic "FrontierCloud metrics";
            auth_basic_user_file /run/frontiercloud/metrics.htpasswd;
            set $metrics_redis_upstream http://redis_exporter:9121/metrics;
            proxy_pass $metrics_redis_upstream;
            proxy_set_header Authorization "";
        }

        location = /internal/metrics/mysql {
            allow ${MONITORING_ALLOW_CIDR};
            allow ${MONITORING_SELF_ALLOW_CIDR};
            deny all;
            auth_basic "FrontierCloud metrics";
            auth_basic_user_file /run/frontiercloud/metrics.htpasswd;
            set $metrics_mysql_upstream http://mysql_exporter:9104/metrics;
            proxy_pass $metrics_mysql_upstream;
            proxy_set_header Authorization "";
        }

        location = /internal/metrics/nginx {
            allow ${MONITORING_ALLOW_CIDR};
            allow ${MONITORING_SELF_ALLOW_CIDR};
            deny all;
            auth_basic "FrontierCloud metrics";
            auth_basic_user_file /run/frontiercloud/metrics.htpasswd;
            set $metrics_nginx_upstream http://nginx_exporter:9113/metrics;
            proxy_pass $metrics_nginx_upstream;
            proxy_set_header Authorization "";
        }

        location = /internal/metrics/nginxlog {
            allow ${MONITORING_ALLOW_CIDR};
            allow ${MONITORING_SELF_ALLOW_CIDR};
            deny all;
            auth_basic "FrontierCloud metrics";
            auth_basic_user_file /run/frontiercloud/metrics.htpasswd;
            set $metrics_nginxlog_upstream http://nginxlog_exporter:4040/metrics;
            proxy_pass $metrics_nginxlog_upstream;
            proxy_set_header Authorization "";
        }

        location = /internal/report/security {
            allow ${MONITORING_ALLOW_CIDR};
            allow ${MONITORING_SELF_ALLOW_CIDR};
            deny all;
            auth_basic "FrontierCloud reporting";
            auth_basic_user_file /run/frontiercloud/metrics.htpasswd;
            proxy_pass http://web:8000/internal/report/security;
            proxy_set_header X-Metrics-Token "${INTERNAL_METRICS_TOKEN}";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Forwarded "";
            proxy_set_header Authorization "";
            access_log off;
        }

        location = /internal/report/access-log {
            allow ${MONITORING_ALLOW_CIDR};
            allow ${MONITORING_SELF_ALLOW_CIDR};
            deny all;
            auth_basic "FrontierCloud reporting";
            auth_basic_user_file /run/frontiercloud/metrics.htpasswd;
            alias /var/log/nginx/access_log.log;
            default_type text/plain;
            add_header Cache-Control "private, no-store" always;
            access_log off;
        }

        # Admin assets change with application behavior and must never remain on
        # an old JavaScript implementation after a deployment.
        location = /static/js/admin.js {
            alias /app/static/js/admin.js;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        location = /static/css/admin.css {
            alias /app/static/css/admin.css;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        location = /static/js/player.js {
            alias /app/static/js/player.js;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        location = /static/css/player.css {
            alias /app/static/css/player.css;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        location = /static/js/network-observation.js {
            alias /app/static/js/network-observation.js;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        location /static/ {
            alias /app/static/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # FastAPI authorizes the admin request and then delegates the file body
        # to Nginx. `internal` prevents bypassing the admin session check.
        location ^~ /_protected_media/ {
            internal;
            alias /app/data/media/;
            sendfile on;
            tcp_nopush on;
            add_header Cache-Control "private, no-store" always;
        }

        location /api/v1/media/admin/ {
            proxy_pass http://web:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_read_timeout ${UPLOAD_INACTIVITY_TIMEOUT}s;
            proxy_send_timeout ${UPLOAD_INACTIVITY_TIMEOUT}s;
            add_header Cache-Control "no-store" always;
        }

        location / {
            proxy_pass http://web:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
