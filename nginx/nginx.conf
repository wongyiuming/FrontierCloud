user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    map $http_traceparent $trace_id {
        ~^[0-9a-f]{2}-([0-9a-f]{32})- $1;
        default "";
    }

    log_format structured escape=json
        '{"timestamp":"$time_iso8601","level":"INFO","component":"nginx",'
        '"instance":"${INSTANCE_NAME}","request_id":"$request_id",'
        '"trace_id":"$trace_id","client_ip":"$remote_addr",'
        '"method":"$request_method","path":"$uri","status":$status,'
        '"duration_seconds":$request_time,"bytes_sent":$body_bytes_sent}';
    access_log /dev/stdout structured;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    limit_req_status 429;
    client_max_body_size 820M;
    client_body_timeout ${UPLOAD_INACTIVITY_TIMEOUT}s;

    include /etc/nginx/runtime/environment-servers.conf;

    server {
        include /etc/nginx/runtime/public-listen.conf;
        server_name ${SERVER_NAME};
        include /etc/nginx/runtime/public-tls.conf;

        location = /static/js/admin.js { alias /app/static/js/admin.js; expires -1; add_header Cache-Control "no-store, no-cache, must-revalidate" always; }
        location = /static/css/admin.css { alias /app/static/css/admin.css; expires -1; add_header Cache-Control "no-store, no-cache, must-revalidate" always; }
        location = /static/js/player.js { alias /app/static/js/player.js; expires -1; add_header Cache-Control "no-store, no-cache, must-revalidate" always; }
        location = /static/css/player.css { alias /app/static/css/player.css; expires -1; add_header Cache-Control "no-store, no-cache, must-revalidate" always; }
        location = /static/js/network-observation.js { alias /app/static/js/network-observation.js; expires -1; add_header Cache-Control "no-store, no-cache, must-revalidate" always; }
        location /static/ { alias /app/static/; expires 30d; add_header Cache-Control "public, no-transform"; }

        location ^~ /_protected_media/ {
            internal;
            alias /app/data/media/;
            sendfile on;
            tcp_nopush on;
            add_header Cache-Control "private, no-store" always;
        }

        location /api/v1/media/admin/ {
            proxy_pass http://web:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_read_timeout ${UPLOAD_INACTIVITY_TIMEOUT}s;
            proxy_send_timeout ${UPLOAD_INACTIVITY_TIMEOUT}s;
            add_header Cache-Control "no-store" always;
        }

        location / {
            proxy_pass http://web:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
