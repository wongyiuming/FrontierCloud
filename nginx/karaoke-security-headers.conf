add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
# Python assigns a per-response script nonce. Do not add a second CSP here;
# intersecting it with a self-only policy would block the trusted inline config.
add_header Strict-Transport-Security $frontiercloud_hsts always;
