<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>前沿娱乐 · 系统维护</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#070b12;color:#eaf2fb;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 18% 0,rgba(67,127,255,.16),transparent 34%),radial-gradient(circle at 82% 8%,rgba(58,213,232,.10),transparent 30%),linear-gradient(180deg,#07101a,#070b12)}.orb{position:fixed;width:38vw;height:38vw;min-width:320px;min-height:320px;border-radius:50%;filter:blur(80px);opacity:.13;pointer-events:none}.orb.one{left:-18vw;bottom:-22vw;background:#397cff}.orb.two{right:-18vw;top:-24vw;background:#32d7df}.shell{position:relative;width:min(720px,calc(100vw - 32px));padding:clamp(28px,5vw,54px);overflow:hidden;background:linear-gradient(180deg,rgba(17,29,45,.92),rgba(10,18,29,.95));border:1px solid rgba(107,145,187,.26);border-radius:24px;box-shadow:0 28px 90px rgba(0,0,0,.45),inset 0 1px rgba(255,255,255,.035);backdrop-filter:blur(20px)}.shell:before{content:"";position:absolute;inset:0 0 auto;height:2px;background:linear-gradient(90deg,transparent,#55a7ff,#35d4e8,transparent);opacity:.85}.badge{display:inline-flex;align-items:center;gap:9px;padding:7px 12px;color:#b8d8f7;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:#0c1b2b;border:1px solid #26435e;border-radius:999px}.badge:before{content:"";width:9px;height:9px;border-radius:50%;background:#f6c85f;box-shadow:0 0 18px rgba(246,200,95,.75);animation:pulse 1.8s ease-in-out infinite}.brand{margin:30px 0 8px;color:#8ea5bd;font-size:13px;letter-spacing:.12em}h1{margin:0;font-size:clamp(34px,7vw,64px);line-height:1.05;letter-spacing:-.035em}p{max-width:560px;margin:18px 0 0;color:#9fb0c2;font-size:clamp(14px,2.2vw,17px);line-height:1.8}.status{display:grid;grid-template-columns:auto 1fr;gap:12px 18px;align-items:center;margin-top:30px;padding:16px;background:#09131f;border:1px solid #20354a;border-radius:14px}.status strong{font-size:13px}.status span{color:#758aa1;font-size:12px}.track{grid-column:1/-1;height:7px;overflow:hidden;background:#050b12;border-radius:999px}.track i{display:block;width:42%;height:100%;background:linear-gradient(90deg,#4d88ff,#35d4e8);border-radius:inherit;animation:scan 2.2s ease-in-out infinite}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}.actions button{min-height:40px;padding:0 18px;color:#e8f3ff;cursor:pointer;background:linear-gradient(180deg,#1b3149,#13263a);border:1px solid #385574;border-radius:10px;font:inherit;font-weight:650}.actions button:hover{border-color:#5e86ac;background:linear-gradient(180deg,#213b58,#172d44)}.hint{margin-top:18px;color:#60758b;font-size:12px}.hint strong{color:#8299b0;font-weight:600}@keyframes pulse{50%{opacity:.45;transform:scale(.82)}}@keyframes scan{0%{transform:translateX(-115%)}50%{transform:translateX(115%)}100%{transform:translateX(260%)}}@media(max-width:560px){.shell{border-radius:18px}.status{grid-template-columns:1fr}.track{grid-column:1}.actions button{width:100%}}
</style>
</head>
<body>
<div class="orb one"></div><div class="orb two"></div>
<main class="shell">
    <div class="badge">Maintenance</div>
    <div class="brand">前沿娱乐 · FRONTIER</div>
    <h1>站点正在维护</h1>
    <p>当前公共服务已暂时关闭。可能正在进行版本发布、节点收敛或人工维护；Admin 与内部控制通道仍保持可用。</p>
    <section class="status" aria-live="polite">
        <strong>服务恢复检测</strong><span id="countdown">20 秒后自动重试</span>
        <div class="track" aria-hidden="true"><i></i></div>
    </section>
    <div class="actions"><button type="button" id="retry">立即重试</button></div>
    <div class="hint">若你是管理员，请进入 <strong>Admin → 站点开放状态</strong> 查看维护来源并结束维护。</div>
</main>
<script>
(() => {
    let left = 20;
    const label = document.getElementById('countdown');
    const retry = () => location.reload();
    document.getElementById('retry').addEventListener('click', retry);
    setInterval(() => {
        left -= 1;
        if (left <= 0) return retry();
        label.textContent = `${left} 秒后自动重试`;
    }, 1000);
})();
</script>
</body>
</html>
