set $frontiercloud_maintenance 0;
# Manual maintenance is owned by the Web Admin through the shared data directory.
if (-f /app/data/.frontiercloud-maintenance) { set $frontiercloud_maintenance 1; }
# Ordinary manual maintenance keeps authenticated Admin/node communication usable.
if ($uri ~ "^/(?:api/v1/media/admin(?:/|$)|internal/v1(?:/|$)|static(?:/|$)|health(?:/|$)|metrics$|__maintenance\.html$)") { set $frontiercloud_maintenance 0; }
# An offline operator owns the hard migration fence. Check it LAST so neither
# Admin reopening nor an obsolete force-open file can bypass database quiescence.
if (-f /app/data/.frontiercloud-native-maintenance) { set $frontiercloud_maintenance 1; }
# Health and the fixed internal error document perform no business mutations.
if ($uri ~ "^/(?:health(?:/|$)|metrics$|__maintenance\.html$)") { set $frontiercloud_maintenance 0; }
if ($frontiercloud_maintenance = 1) { return 503; }
error_page 503 /__maintenance.html;
location = /__maintenance.html {
    internal;
    alias /usr/share/nginx/html/maintenance.html;
    default_type text/html;
    add_header Cache-Control "no-store" always;
}
