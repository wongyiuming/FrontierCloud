set $frontiercloud_maintenance 0;
# Automatic release maintenance is owned by the isolated updater.
if (-f /run/frontiercloud-maintenance/enabled) { set $frontiercloud_maintenance 1; }
# Manual maintenance is owned by the Web Admin through the shared data directory.
if (-f /app/data/.frontiercloud-maintenance) { set $frontiercloud_maintenance 1; }
# A failed release intentionally keeps the updater gate closed. An explicit Admin
# reopen action creates this override; starting a new release removes it first.
if (-f /app/data/.frontiercloud-force-open) { set $frontiercloud_maintenance 0; }
# Keep Admin and cluster control reachable while public business traffic is gated.
if ($uri ~ "^/(?:api/v1/media/admin(?:/|$)|internal/v1/cluster-update(?:/|$)|static(?:/|$)|health(?:/|$)|metrics$|__maintenance\.html$)") { set $frontiercloud_maintenance 0; }
if ($frontiercloud_maintenance = 1) { return 503; }
error_page 503 /__maintenance.html;
location = /__maintenance.html {
    internal;
    alias /usr/share/nginx/html/maintenance.html;
    default_type text/html;
    add_header Cache-Control "no-store" always;
}
