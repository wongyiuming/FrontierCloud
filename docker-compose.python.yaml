# Explicit Python reference profile; SQLite has no bundled MySQL dependency.
# Optional MySQL overlay: docker-compose.python.yaml:docker-compose.gin-mysql.yaml
name: ${COMPOSE_PROJECT_NAME:-frontiercloud-reference}

x-app-image: &app-image
  image: frontiercloud-web
  build: {context: ., dockerfile: Dockerfile.python}

services:
  secrets-init:
    <<: *app-image
    user: "0:0"
    command: ["python", "-m", "app.services.runtime_secrets"]
    restart: "no"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    volumes: [runtime_secrets:/run/frontiercloud-secrets]
    logging: &service_logging
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  media-init:
    <<: *app-image
    user: "0:0"
    command: ["python", "-m", "app.services.media_storage_init"]
    restart: "no"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    volumes:
      - ${DATA_DIRECTORY:-./data}:/app/data:z
    logging: *service_logging

  updater:
    build: {context: ., dockerfile: updater/Dockerfile}
    image: frontiercloud-updater
    restart: always
    environment:
      RELEASE_BRANCH: ${RELEASE_BRANCH:-main}
      UPDATER_PROJECT: ${COMPOSE_PROJECT_NAME:-frontiercloud-reference}
      UPDATER_DATA_DIRECTORY: /data
    user: "0:0"
    command: ["python", "/workspace/updater/server.py"]
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # Selected data-root access for maintenance; no other capabilities.
    cap_add: [DAC_OVERRIDE]
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_DIRECTORY:-./data}:/data:z
      - updater_control:/run/frontiercloud-updater
      - maintenance_state:/run/frontiercloud-maintenance
    tmpfs:
      - /tmp:size=64m,mode=1777
    logging: *service_logging

  web:
    <<: *app-image
    restart: always
    env_file:
      - path: .env
        required: false
    environment:
      TLS_ENABLED: ${TLS_ENABLED:-false}
      PYTHONDONTWRITEBYTECODE: "1"
      DB_TYPE: ${DB_TYPE:-sqlite}
      SQLITE_PATH: ${SQLITE_PATH:-/app/data/frontiercloud.db}
      DATA_ROOT: /app/data
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-office_automation}
      MYSQL_USER: ${MYSQL_USER:-media_admin}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RELEASE_BRANCH: ${RELEASE_BRANCH:-main}
      RELEASE_SOURCE_BRANCH: ${RELEASE_SOURCE_BRANCH:-dev}
      RELEASE_MANIFEST_PATH: ${RELEASE_MANIFEST_PATH:-}
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    expose: ["8000"]
    depends_on:
      secrets-init: {condition: service_completed_successfully}
      media-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    volumes:
      - ${DATA_DIRECTORY:-./data}:/app/data:z
      - web_tmp:/tmp
      - runtime_secrets:/run/frontiercloud-secrets
      - updater_control:/run/frontiercloud-updater:ro
    healthcheck:
      test: ["CMD", "python", "-m", "app.services.health_probe"]
      interval: 30s
      start_interval: 2s
      timeout: 5s
      retries: 4
      start_period: 15s
    stop_grace_period: 3s
    logging: *service_logging

  redis:
    image: redis:7.4.11-alpine
    restart: always
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *service_logging

  nginx:
    build: {context: ., dockerfile: nginx/Dockerfile}
    image: frontiercloud-nginx
    restart: always
    environment:
      TLS_ENABLED: ${TLS_ENABLED:-false}
      SERVER_NAME: ${SERVER_NAME:-localhost}
      INSTANCE_NAME: ${INSTANCE_NAME:-frontiercloud}
      PUBLIC_BIND_ADDRESS: ${PUBLIC_BIND_ADDRESS:-0.0.0.0}
      UPLOAD_INACTIVITY_TIMEOUT: ${ADMIN_UPLOAD_INACTIVITY_TIMEOUT:-300}
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
    ports:
      - target: 80
        published: "${HTTP_PORT:-80}"
        protocol: tcp
        host_ip: ${PUBLIC_BIND_ADDRESS:-0.0.0.0}
      - target: 443
        published: "${HTTPS_PORT:-443}"
        protocol: tcp
        host_ip: ${PUBLIC_BIND_ADDRESS:-0.0.0.0}
    volumes:
      - ${DATA_DIRECTORY:-./data}:/app/data:ro,z
      - ${SSL_CERT_PATH:-./certs/fullchain.pem}:/etc/nginx/certs/fullchain.pem:ro
      - ${SSL_KEY_PATH:-./certs/privkey.pem}:/etc/nginx/certs/privkey.pem:ro
      - ${ACME_WEBROOT:-./certs/acme}:/var/www/certbot:ro
      - maintenance_state:/run/frontiercloud-maintenance:ro
    depends_on:
      web: {condition: service_healthy}
    stop_grace_period: 3s
    logging: *service_logging

  stun:
    image: coturn/coturn:4.17.2-r0-alpine
    restart: always
    command: [-n, --stun-only, --no-auth, --no-cli, --no-tls, --no-dtls, --fingerprint, --no-multicast-peers, --log-file=stdout, --simple-log, --listening-port=3478]
    ports:
      - target: 3478
        published: "${WEBRTC_STUN_PORT:-3478}"
        protocol: tcp
        host_ip: ${PUBLIC_BIND_ADDRESS:-0.0.0.0}
      - target: 3478
        published: "${WEBRTC_STUN_PORT:-3478}"
        protocol: udp
        host_ip: ${PUBLIC_BIND_ADDRESS:-0.0.0.0}
    read_only: true
    tmpfs:
      - /tmp:size=4m,mode=1777
      - /var/lib/coturn:size=4m,mode=0700
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 32m
    cpus: "0.20"
    pids_limit: 64
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

volumes:
  web_tmp:
  runtime_secrets:
  redis_data:
  updater_control:
  maintenance_state:
