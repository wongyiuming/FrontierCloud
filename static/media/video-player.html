<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{PAGE_TITLE}}</title>
    <link rel="stylesheet" href="{{PLAYER_CSS_URL}}">
</head>
<body class="video-player-page">
    <div class="player-section" id="playerSection">
        <div id="artplayer" class="artplayer-app"></div>
    </div>
    <div class="sidebar">
        <div class="sidebar-header">
            <span>四大发明</span>
            <span class="header-actions"><a href="{{CATEGORY_LIST_URL}}" class="back-btn">← 返回分类</a></span>
        </div>
        <div class="player-controls">
            <button class="control-btn" onclick="playPrev()">⏮ up_music</button>
            <button class="control-btn" onclick="playNext()">next_music ⏭</button>
        </div>
        <ul id="mediaList" class="media-list"></ul>
    </div>

    <script>
        const currentMediaList = {{MEDIA_JSON}};
        const playbackSessionId = {{PLAYBACK_SESSION_ID}};
        window.frontierCloudStunUrls = {{STUN_URLS_JSON}};
        window.frontierCloudWebrtcIntervalMs = {{WEBRTC_INTERVAL_MS}};
        const PAGE_TITLE = '{{PAGE_TITLE}}';
        const PLAYER_KIND = 'video';
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/artplayer/5.1.1/artplayer.js"></script>
    <script src="{{NETWORK_OBSERVATION_JS_URL}}"></script>
    <script src="{{PLAYER_JS_URL}}"></script>
</body>
</html>
