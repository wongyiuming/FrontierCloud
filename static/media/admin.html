<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>前沿视界 · Admin</title>
    <link rel="stylesheet" href="/static/css/admin.css?v=20260815-1">
</head>
<body>
    <section class="admin-console">
        <header class="console-header">
            <div>
                <strong>Web 安全日志</strong>
                <small>仅展示本 Web 进程产生的关键日志，不授予 Docker Socket 权限</small>
            </div>
            <span id="transportBadge" class="transport-badge">检查传输安全性…</span>
        </header>
        <pre id="logOutput" class="log-output" aria-live="polite">正在连接日志控制台…</pre>

        <section id="securityPanel" class="security-panel">
            <header class="security-header">
                <div>
                    <strong>IP 安全防护</strong>
                    <small id="securitySummary">正在加载…</small>
                </div>
                <div class="security-header-actions">
                    <button id="securityRefresh" type="button">刷新</button>
                    <button id="securityToggle" type="button" aria-expanded="true">收起</button>
                </div>
            </header>
            <div id="securityPanelBody" class="security-body">
                <div class="security-stats">
                    <span>合法 API <strong id="legalApiCount">-</strong></span>
                    <span>当前封禁 <strong id="activeBanCount">-</strong></span>
                    <span>永久白名单 <strong id="whitelistCount">-</strong></span>
                </div>
                <form id="whitelistForm" class="whitelist-form">
                    <input id="whitelistIp" type="text" inputmode="text" autocomplete="off" placeholder="IPv4 或 IPv6">
                    <input id="whitelistNote" type="text" maxlength="255" autocomplete="off" placeholder="备注（可选）">
                    <button type="submit">永久加白</button>
                </form>
                <div class="security-section-title">最近 24 小时自动封禁</div>
                <div id="banList" class="security-list"></div>
                <div class="security-section-title">永久白名单</div>
                <div id="whitelistList" class="security-list whitelist-list"></div>
            </div>
        </section>
    </section>

    <aside class="admin-side">
        <header class="admin-header">
            <strong>媒体管理</strong>
            <div>
                <button id="backPublic">公共视图</button>
                <button id="logout">退出特权</button>
            </div>
        </header>

        <div class="toolbar">
            <div class="upload-wrap">
                <button id="uploadBtn">上传 ▾</button>
                <div class="upload-menu">
                    <button id="uploadFiles">上传文件</button>
                    <button id="uploadFolder">上传文件夹</button>
                </div>
            </div>
            <button id="download" disabled>下载</button>
            <button id="hide" disabled>隐藏</button>
            <button id="delete" disabled>删除</button>
        </div>

        <section id="uploadProgress" class="upload-progress hidden" aria-live="polite">
            <div class="progress-heading">
                <strong id="uploadTaskTitle">上传任务</strong>
                <span id="uploadSummary"></span>
            </div>
            <label for="currentProgress"><span id="currentFileLabel">当前文件</span><span id="currentPercent">0%</span></label>
            <progress id="currentProgress" max="100" value="0"></progress>
            <label for="totalProgress"><span id="totalTaskLabel">任务总进度</span><span id="totalPercent">0%</span></label>
            <progress id="totalProgress" max="100" value="0"></progress>
            <div id="uploadResults" class="upload-results"></div>
        </section>

        <div class="selection" id="selection">未选择</div>
        <div class="pathbar" id="pathbar">/</div>
        <div id="tree" class="tree"></div>
    </aside>

    <input id="fileInput" type="file" multiple hidden accept=".mp3,.m4a,.flac,.wav,.mp4,.webm,.mkv">
    <input id="folderInput" type="file" multiple webkitdirectory directory hidden>

    <div id="modal" class="modal hidden">
        <div class="modal-box">
            <h3 id="modalTitle"></h3>
            <div id="modalBody"></div>
            <div class="modal-actions">
                <button id="modalCancel">取消</button>
                <button id="modalOk">确定</button>
            </div>
        </div>
    </div>

    <script src="/static/js/admin.js?v=20260815-1"></script>
</body>
</html>
