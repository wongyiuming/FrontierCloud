<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>前沿娱乐 · Admin</title>
    <link rel="stylesheet" href="/static/css/admin.css?v=20260921-2">
</head>
<body>
    <main class="admin-console">
        <section class="admin-module key-panel" data-admin-module="key">
            <button class="module-heading" type="button" aria-expanded="false"><span><strong>Admin Key</strong><small>长期 Key 可轮换；临时 Key 单次使用并建立所选时长的滑动会话。</small></span><b>＋</b></button>
            <div class="module-content">
              <div class="key-actions">
                <button id="randomKey" type="button">生成随机强 Key</button>
                <form id="customKeyForm">
                    <input id="customKey" type="password" minlength="16" maxlength="512" autocomplete="new-password" placeholder="自定义新 Key（至少 16 个字符）" required>
                    <input id="customKeyConfirm" type="password" minlength="16" maxlength="512" autocomplete="new-password" placeholder="再次输入确认" required>
                    <button id="customKeySubmit" type="submit">确认更换</button>
                </form>
                <form id="temporaryKeyForm" class="temporary-key-form">
                    <select id="temporaryKeyMinutes" aria-label="临时 Admin Key 滑动会话有效期">
                        <option value="15" selected>15 分钟</option>
                        <option value="30">30 分钟</option>
                        <option value="60">60 分钟</option>
                        <option value="120">120 分钟</option>
                    </select>
                    <button id="temporaryKey" type="submit">生成一次性临时 Key</button>
                </form>
              </div>
              <div id="newKeyResult" class="new-key-result hidden" aria-live="polite"><strong id="newKeyTitle">请立即保存新 Admin Key</strong><code id="newKeyValue"></code><small id="newKeyDetail"></small><button id="copyKey" type="button">复制</button><button id="dismissKey" type="button">关闭</button></div>
            </div>
        </section>

        <section id="priorityPanel" class="admin-module priority-panel" data-admin-module="priority">
            <button class="module-heading" type="button" aria-expanded="false"><span><strong>媒体展示优先级</strong><small>沿用现有积分与优先级数据；数值越高越先展示</small></span><b>＋</b></button>
            <div class="module-content priority-content">
                <form id="priorityFilterForm" class="priority-toolbar">
                    <input id="prioritySearch" type="search" maxlength="100" autocomplete="off" placeholder="搜索媒体名称或路径">
                    <select id="priorityType" aria-label="媒体类型">
                        <option value="">全部媒体</option>
                        <option value="audio">音乐</option>
                        <option value="video">视频</option>
                    </select>
                    <button type="submit">查询</button>
                    <button id="priorityRefresh" type="button">刷新</button>
                </form>
                <div id="prioritySummary" class="priority-summary">尚未加载</div>
                <div id="priorityList" class="priority-list"></div>
                <div class="priority-pagination">
                    <button id="priorityPrev" type="button">上一页</button>
                    <span id="priorityPageInfo">第 1 / 1 页</span>
                    <button id="priorityNext" type="button">下一页</button>
                </div>
            </div>
        </section>

        <section id="securityPanel" class="admin-module security-panel expanded" data-admin-module="security">
            <header class="security-header">
                <button class="module-heading" type="button" aria-expanded="true"><span>
                    <strong>IP 安全防护</strong>
                    <small id="securitySummary">正在加载…</small>
                </span><b>−</b></button>
                <div class="security-header-actions module-action-host">
                    <button id="securityRefresh" type="button">刷新</button>
                </div>
            </header>
            <div id="securityPanelBody" class="module-content security-body">
                <div class="security-stats">
                    <span>合法 API <strong id="legalApiCount">-</strong></span>
                    <span>当前封禁 <strong id="activeBanCount">-</strong></span>
                    <span>永久白名单 <strong id="whitelistCount">-</strong></span>
                </div>
                <form id="whitelistForm" class="whitelist-form">
                    <input id="whitelistIp" type="text" inputmode="text" autocomplete="off" placeholder="IPv4 或 IPv6">
                    <input id="whitelistNote" type="text" maxlength="255" autocomplete="off" placeholder="备注（可选）">
                    <button type="submit">永久加白</button>
                </form>
                <form id="permanentBanForm" class="permanent-ban-form">
                    <input id="permanentBanIp" type="text" inputmode="text" autocomplete="off" placeholder="需要永久拉黑的 IPv4 或 IPv6" required>
                    <input id="permanentBanReason" type="text" maxlength="255" autocomplete="off" placeholder="永久拉黑原因（必填）" required>
                    <button type="submit">永久拉黑</button>
                </form>
                <form id="securityFilterForm" class="security-filter-form">
                    <input id="securityIpFilter" type="text" maxlength="45" autocomplete="off" placeholder="精确 IP（可选）">
                    <select id="securityStatusFilter">
                        <option value="">全部状态</option>
                        <option value="active">当前封禁</option>
                        <option value="observed">攻击观察中（未封禁）</option>
                        <option value="history">历史封禁过</option>
                        <option value="permanent">已永久封禁</option>
                        <option value="whitelisted">白名单</option>
                    </select>
                    <select id="securityIpOrder" aria-label="IP 或最后攻击时间排序">
                        <option value="ip_asc">IP 从小到大</option>
                        <option value="ip_desc">IP 从大到小</option>
                        <option value="last_attack_desc">最近攻击优先</option>
                        <option value="last_attack_asc">最早攻击优先</option>
                    </select>
                    <button type="submit">查询</button>
                </form>
                <div class="security-section-title">IP 状态摘要 · 明细请查询 MySQL</div>
                <div id="banList" class="security-list"></div>
                <div class="security-pagination">
                    <button id="securityPrev" type="button">上一页</button>
                    <span id="securityPageInfo">第 1 / 1 页</span>
                    <button id="securityNext" type="button">下一页</button>
                </div>
                <div class="security-section-title">永久白名单</div>
                <div id="whitelistList" class="security-list whitelist-list"></div>
            </div>
        </section>

        <section id="lyricsPanel" class="admin-module lyrics-panel" data-admin-module="lyrics">
            <button class="module-heading" type="button" aria-expanded="false"><span><strong>歌词关联</strong><small>先选择一首曲目或一份歌词，再进入连线编辑</small></span><b>＋</b></button>
            <div class="module-content lyrics-content">
                <div class="lyrics-stats">
                    <span>曲目<strong id="lyricsTrackCount">-</strong></span>
                    <span>歌词<strong id="lyricsFileCount">-</strong></span>
                    <span>关联<strong id="lyricsRelationCount">-</strong></span>
                </div>
                <div class="lyrics-toolbar">
                    <span id="lyricsModeStatus">请选择一个起点</span>
                    <button id="lyricsRefresh" type="button">刷新</button>
                    <button id="lyricsEnterLink" type="button" disabled>进入连线</button>
                    <button id="lyricsCancelLink" class="hidden" type="button">取消</button>
                    <button id="lyricsSaveLink" class="hidden" type="button">保存关联</button>
                </div>
                <div class="lyrics-browser">
                    <section>
                        <label>曲目<input id="lyricsTrackFilter" type="search" maxlength="100" placeholder="搜索当前目录及其子目录"></label>
                        <div id="lyricsTrackPath" class="lyrics-pathbar">/data/media/music</div>
                        <div id="lyricsTrackList" class="lyrics-object-list"></div>
                    </section>
                    <section>
                        <label>歌词<input id="lyricsFileFilter" type="search" maxlength="100" placeholder="搜索当前目录及其子目录"></label>
                        <div id="lyricsFilePath" class="lyrics-pathbar">/data/media/lyrics</div>
                        <div id="lyricsFileList" class="lyrics-object-list"></div>
                    </section>
                </div>
                <div class="lyrics-graph-wrap"><svg id="lyricsGraph" class="lyrics-graph" role="img" aria-label="当前选中对象的歌词关联图"></svg></div>
            </div>
        </section>
        <section id="networkPanel" class="admin-module network-panel" data-admin-module="network">
            <button class="module-heading" type="button" aria-expanded="false"><span><strong>WebRTC 网络关系</strong><small>最近访问的公网 IP 与 WebRTC IP 聚合关系</small></span><b>＋</b></button>
            <div class="module-content network-content">
                <form id="networkFilterForm" class="network-filter-form">
                    <input id="networkPublicIp" type="text" maxlength="45" autocomplete="off" placeholder="公网 IP（精确查询）">
                    <input id="networkWebrtcIp" type="text" maxlength="45" autocomplete="off" placeholder="WebRTC IP（精确查询）">
                    <button type="submit">查询</button>
                    <button id="networkReset" type="button">最近访问</button>
                </form>
                <div id="networkSummary" class="network-summary">尚未加载</div>
                <div id="networkViewSwitch" class="network-view-switch" role="group" aria-label="WebRTC 关系展示方式">
                    <button type="button" class="selected" data-network-view="public">公网 IP → WebRTC IP</button>
                    <button type="button" data-network-view="webrtc">WebRTC IP → 公网 IP</button>
                </div>
                <div id="networkList" class="network-list"></div>
                <div class="network-pagination">
                    <button id="networkPrev" type="button">上一页</button>
                    <span id="networkPageInfo">第 1 / 1 页</span>
                    <button id="networkNext" type="button">下一页</button>
                </div>
            </div>
        </section>
        <section id="nodesPanel" class="admin-module nodes-panel" data-admin-module="nodes">
            <button class="module-heading" type="button" aria-expanded="false"><span><strong>节点管理</strong><small>角色、配对关系及联合状态</small></span><b>＋</b></button>
            <div class="module-content nodes-content">
                <div class="nodes-toolbar"><strong id="nodeIdentity">尚未加载</strong><button id="nodesRefresh" type="button">刷新</button></div>
                <form id="nodePromotion" class="nodes-toolbar hidden"><select id="nodeRole" aria-label="节点角色"><option>Master</option><option>Slave</option></select><input id="nodeEndpoint" type="url" required placeholder="当前节点 HTTPS 根地址"><button type="submit">固定角色</button></form>
                <div id="nodePairing" class="hidden"><div class="nodes-toolbar"><button id="nodeIssuePair" type="button">生成一次性配对包</button><button id="nodeImportPair" type="button">导入 Slave 配对包</button></div><textarea id="nodePairPackage" rows="4" aria-label="一次性配对包" placeholder="配对包只用于建立当前关系，五分钟后过期"></textarea></div>
                <div class="nodes-table-scroll"><table class="nodes-table"><thead><tr><th>节点 / HTTPS 地址</th><th>状态 / RTT / 心跳</th><th>版本 / 同步 / 存储</th><th>当前关系操作</th></tr></thead><tbody id="nodeRelationships"></tbody></table></div>
                <form id="nodeReinitialize" class="nodes-toolbar hidden"><input id="nodeResetConfirmation" autocomplete="off" placeholder="输入当前节点 ID 确认重置"><button type="submit">重新初始化节点</button><span>撤销旧关系，保留媒体文件</span></form>
                <div id="nodeOperationStatus" role="status"></div>
            </div>
        </section>

    <section class="admin-module admin-side" data-admin-module="media">
        <header class="admin-header">
            <button class="module-heading" type="button" aria-expanded="false"><span><strong>媒体管理</strong><small>上传、下载、隐藏及删除媒体</small></span><b>＋</b></button>
            <div id="globalAdminActions" class="admin-header-actions global-admin-actions">
                <button id="backPublic" type="button">公共视图</button>
                <button id="logout" type="button">退出特权</button>
            </div>
        </header>
        <div class="module-content media-content">
        <div class="toolbar">
            <div class="upload-wrap">
                <button id="uploadBtn">上传 ▾</button>
                <div class="upload-menu">
                    <button id="uploadFiles">上传文件</button>
                    <button id="uploadFolder">上传文件夹</button>
                    <button id="uploadLyrics">上传歌词</button>
                </div>
            </div>
            <button id="download" disabled>下载</button>
            <button id="hide" disabled>隐藏</button>
            <button id="delete" disabled>删除</button>
            <input id="mediaSearch" class="media-search-input" type="search" maxlength="100" autocomplete="off" placeholder="请先进入 music、vido 或 lyrics 后搜索" disabled>
        </div>

        <section id="uploadProgress" class="upload-progress hidden" aria-live="polite">
            <div class="progress-heading">
                <strong id="uploadTaskTitle">上传任务</strong>
                <span id="uploadSummary"></span>
            </div>
            <label for="currentProgress"><span id="currentFileLabel">当前文件</span><span id="currentPercent">0%</span></label>
            <progress id="currentProgress" max="100" value="0"></progress>
            <label for="totalProgress"><span id="totalTaskLabel">任务总进度</span><span id="totalPercent">0%</span></label>
            <progress id="totalProgress" max="100" value="0"></progress>
            <div id="uploadResults" class="upload-results"></div>
        </section>

        <div class="selection" id="selection">未选择</div>
        <div class="pathbar" id="pathbar">/</div>
        <div id="tree" class="tree"></div>
        </div>
    </section>
    </main>

    <input id="fileInput" type="file" multiple hidden accept=".mp3,.m4a,.flac,.wav,.mp4,.webm,.mkv">
    <input id="folderInput" type="file" multiple webkitdirectory directory hidden>
    <input id="lyricsInput" type="file" multiple hidden accept=".lrc">

    <div id="modal" class="modal hidden">
        <div class="modal-box">
            <h3 id="modalTitle"></h3>
            <div id="modalBody"></div>
            <div class="modal-actions">
                <button id="modalCancel">取消</button>
                <button id="modalOk">确定</button>
            </div>
        </div>
    </div>

    <script src="/static/js/admin.js?v=20260921-1"></script>
    <script src="/static/js/nodes.js?v=20260921-1"></script>
</body>
</html>
