<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{PAGE_TITLE}}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #121212; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { text-align: center; max-width: 760px; width: 92%; }
        .header { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 2rem; }
        .page-brand { display: flex; min-width: 0; align-items: center; gap: 14px; text-align: left; }
        .page-brand img { display: block; width: min(360px, 52vw); height: auto; object-fit: contain; }
        .page-brand-suffix { color: #d8e4f0; font-size: 1.05rem; font-weight: 700; white-space: nowrap; }
        .page-brand-suffix:empty { display: none; }
        .back-btn { flex: 0 0 auto; color: #888; text-decoration: none; font-size: 14px; }
        .back-btn:hover { color: #fff; }
        .card-grid { display: flex; flex-direction: column; gap: 15px; }
        .card { background: #1e1e1e; border: 1px solid #2d2d2d; border-radius: 10px; padding: 20px; text-decoration: none; color: #fff; display: flex; align-items: center; justify-content: space-between; transition: background 0.2s; }
        .card:hover { background: #282828; }
        .card-title { font-size: 1.1rem; font-weight: bold; }
        .card-arrow { color: #666; font-size: 1.2rem; }
        .empty { color: #666; padding: 40px; }
        @media (max-width: 600px) {
            .header { align-items: flex-start; flex-direction: column; }
            .page-brand img { width: min(420px, 88vw); }
            .back-btn { align-self: flex-end; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div id="pageBrand" class="page-brand" data-page-title="{{PAGE_TITLE}}">
                <img id="pageBrandLogo" alt="">
                <span id="pageBrandSuffix" class="page-brand-suffix"></span>
            </div>
            <a href="{{BACK_URL}}" class="back-btn">← 返回上级</a>
        </div>
        <div id="categoryGrid" class="card-grid"><div class="empty">正在加载目录…</div></div>
    </div>
    <script>
        const pageBrand = document.getElementById('pageBrand');
        const pageTitle = pageBrand.dataset.pageTitle || '';
        let brandKind = 'entertainment';
        let brandLabel = '前沿娱乐';
        let sourcePrefix = brandLabel;
        if (pageTitle.startsWith('前沿音乐')) {
            brandKind = 'music'; brandLabel = '前沿音乐'; sourcePrefix = '前沿音乐';
        } else if (pageTitle.startsWith('前沿视讯')) {
            brandKind = 'media'; brandLabel = '前沿媒体'; sourcePrefix = '前沿视讯';
        } else if (pageTitle.startsWith('前沿媒体')) {
            brandKind = 'media'; brandLabel = '前沿媒体'; sourcePrefix = '前沿媒体';
        }
        const brandLogo = document.getElementById('pageBrandLogo');
        brandLogo.src = `/api/v1/media/brand/logo/${brandKind}`;
        brandLogo.alt = brandLabel;
        document.getElementById('pageBrandSuffix').textContent =
            pageTitle.slice(sourcePrefix.length).replace(/^\s*-\s*/, '');
        window.frontierCloudCatalogRevealKind =
            brandKind === 'music' ? 'music' : (brandKind === 'media' ? 'video' : '');
        window.frontierCloudStunUrls = {{STUN_URLS_JSON}};
        window.frontierCloudWebrtcIntervalMs = {{WEBRTC_INTERVAL_MS}};
        window.frontierCloudCatalogConfig = {{CATALOG_CONFIG_JSON}};
    </script>
    <script src="{{MEDIA_BROWSER_JS_URL}}"></script>
    <script src="{{NETWORK_OBSERVATION_JS_URL}}"></script>
</body>
</html>
