<!DOCTYPE html>
<html lang="zh-CN" class="frontier-covers">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{PAGE_TITLE}}</title>
    <link rel="stylesheet" href="{{DIRECTORY_GLOBE_CSS_URL}}">
</head>
<body>
    <div class="container">
        <div class="header">
            <div id="pageBrand" class="page-brand" data-page-title="{{PAGE_TITLE}}">
                <img id="pageBrandLogo" alt="">
                <span id="pageBrandSuffix" class="page-brand-suffix"></span>
            </div>
            <a href="{{BACK_URL}}" class="back-btn">← 返回上级</a>
        </div>
        <main class="orbit-layout">
            <section class="orbit-intro" aria-label="目录信息">
                <div id="directoryEyebrow" class="orbit-eyebrow">前沿UI</div>
                <h1 id="globeTitle">探索你的<br><span>媒体星球</span></h1>
                <div id="globeCount" class="orbit-stat">加载中</div>
            </section>
            <section id="globePanel" class="orbit-panel" aria-label="媒体目录">
                <div class="globe-toolbar">
                    <span id="globeHint">媒体目录</span>
                    <button id="globeToggle" class="globe-toggle" type="button" aria-pressed="false">列表视图</button>
                </div>
                <div id="globeStage" class="globe-stage" role="region" aria-label="九宫格目录，左右滑动翻页" tabindex="0">
                    <div id="categoryGrid" class="card-grid"><div class="empty">正在加载目录…</div></div>
                </div>
                <nav id="albumPagination" class="album-pagination" aria-label="目录翻页" hidden>
                    <div id="albumPages" class="album-pages" aria-hidden="true"></div>
                    <span id="albumPageStatus" aria-live="polite"></span>
                </nav>
            </section>
        </main>
    </div>
    <script>
        const pageBrand = document.getElementById('pageBrand');
        const pageTitle = pageBrand.dataset.pageTitle || '';
        let brandKind = 'entertainment';
        let brandLabel = '前沿娱乐';
        let sourcePrefix = brandLabel;
        if (pageTitle.startsWith('前沿音乐')) {
            brandKind = 'music'; brandLabel = '前沿音乐'; sourcePrefix = '前沿音乐';
        } else if (pageTitle.startsWith('前沿视讯')) {
            brandKind = 'media'; brandLabel = '前沿媒体'; sourcePrefix = '前沿视讯';
        } else if (pageTitle.startsWith('前沿媒体')) {
            brandKind = 'media'; brandLabel = '前沿媒体'; sourcePrefix = '前沿媒体';
        }
        const catalogConfig = {{CATALOG_CONFIG_JSON}};
        const isVideo = catalogConfig.url
            ? new URL(catalogConfig.url, location.href).searchParams.get('media_type') === 'video'
            : brandKind === 'media';
        const mediaKind = isVideo ? 'video' : 'music';
        const categoryLabel = isVideo ? '视频' : '音乐';
        const itemLabel = isVideo ? '视频' : '专辑';
        document.getElementById('directoryEyebrow').textContent = '前沿UI / ' + mediaKind.toUpperCase();
        document.getElementById('globePanel').setAttribute('aria-label', categoryLabel + '目录');
        document.getElementById('albumPagination').setAttribute('aria-label', itemLabel + '翻页');
        const stage = document.getElementById('globeStage');
        stage.dataset.gridLabel = `九宫格${itemLabel}目录，左右滑动翻页`;
        stage.dataset.listLabel = categoryLabel + '目录列表';
        stage.setAttribute('aria-label', stage.dataset.gridLabel);
        const hint = document.getElementById('globeHint');
        hint.dataset.listLabel = `选择${itemLabel}，开始${isVideo ? '观看' : '聆听'}`;
        hint.dataset.directoryLabel = categoryLabel + '目录';
        const brandLogo = document.getElementById('pageBrandLogo');
        brandLogo.src = `/api/v1/media/brand/logo/${brandKind}`;
        brandLogo.alt = brandLabel;
        document.getElementById('pageBrandSuffix').textContent =
            pageTitle.slice(sourcePrefix.length).replace(/^\s*-\s*/, '') || categoryLabel + '目录';
        const directoryLabel = pageTitle.slice(sourcePrefix.length).replace(/^\s*-\s*/, '');
        if (directoryLabel) document.getElementById('globeTitle').textContent = directoryLabel;
        else document.getElementById('globeTitle').lastElementChild.textContent = categoryLabel + '星球';
        const directoryPath = new URL(location.href).searchParams.get('path') || (isVideo ? 'vido' : 'music');
        const pathLabel = directoryPath.split('/').map(part => part === 'music' ? '音乐' : part === 'vido' ? '视频' : part).join(' / ');
        document.getElementById('globeHint').dataset.pathLabel = pathLabel;
        document.getElementById('globeHint').textContent = pathLabel;
        window.frontierCloudCatalogRevealKind = mediaKind;
        window.frontierCloudStunUrls = {{STUN_URLS_JSON}};
        window.frontierCloudWebrtcIntervalMs = {{WEBRTC_INTERVAL_MS}};
        window.frontierCloudCatalogConfig = catalogConfig;
    </script>
    <script src="{{DIRECTORY_GLOBE_JS_URL}}"></script>
    <script src="{{MEDIA_BROWSER_JS_URL}}"></script>
    <script async src="{{NETWORK_OBSERVATION_JS_URL}}"></script>
</body>
</html>
