<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>前沿娱乐 · K歌</title>
  <link rel="stylesheet" href="{{KARAOKE_CSS_URL}}">
</head>
<body>
<main class="shell">
  <header>
    <button id="back" class="quiet" type="button">← 返回播放器</button>
    <div><p class="eyebrow">前沿娱乐</p><h1>K歌</h1></div>
    <div class="account-actions"><span id="accountName" class="stateless">游客</span><button id="account" type="button">登录 / 注册</button></div>
  </header>
  <section class="song card">
    <div><span id="kind" class="badge">媒体</span><h2 id="title">正在载入当前媒体…</h2></div>
    <div class="mode"><button id="original" class="selected" type="button">原唱</button><button id="accompaniment" type="button">伴奏（中置消除）</button></div>
  </section>
  <section class="workspace">
    <div class="stage card">
      <video id="media" playsinline crossorigin="anonymous"></video>
      <div id="lyrics" class="lyrics" aria-live="polite"><p>正在载入歌词…</p></div>
      <div class="transport">
        <button id="record" class="primary" type="button">开始 K 歌</button>
        <button id="pauseResume" type="button" disabled>暂停</button>
        <button id="stop" type="button" disabled>停止录音</button>
        <button id="upload" type="button" disabled>上传</button>
        <button id="fullLyrics" type="button">歌词全屏</button>
      </div>
      <p id="status" class="status">正在检查浏览器实时音频能力…</p>
    </div>
    <aside class="mixer card">
      <h3>设备与实时音频</h3>
      <label>输入设备<select id="inputDevice"><option value="">系统默认麦克风</option></select></label>
      <label>输出设备<select id="outputDevice"><option value="">系统默认输出</option></select></label>
      <button id="refreshDevices" class="quiet" type="button">授权并刷新设备</button>
      <label>媒体播放音量 <output id="songValue">100%</output><input id="songGain" type="range" min="0" max="100" value="100"></label>
      <label class="switch"><input id="songMute" type="checkbox"> 静音媒体</label>
      <label>录音人声增益（写入文件） <output id="voiceValue">100%</output><input id="voiceGain" type="range" min="0" max="200" value="100"></label>
      <label>实时返听音量（仅本机） <output id="monitorValue">100%</output><input id="monitorGain" type="range" min="0" max="200" value="100"></label>
      <label class="switch"><input id="monitor" type="checkbox" checked> 开启实时返听</label>
      <label class="switch"><input id="aec" type="checkbox"> 扬声器模式回声消除（AEC）</label>
      <label>麦克风输入电平 <output id="inputMeterValue">待机</output><progress id="inputMeter" max="1" value="0"></progress></label>
      <p id="captureSettings" class="capabilities">开始录音后显示实际采集参数。</p>
      <p class="route">麦克风 → Web Audio 人声处理 → 录音<br>麦克风 → Web Audio 人声处理 → 返听<br>媒体 → 输出（不进入录音）</p>
      <p id="capabilities" class="capabilities"></p>
      <p class="warning">默认开启较明显的人声返听，建议使用耳机。使用扬声器时如出现回授或啸叫，请关闭返听并按需开启 AEC。</p>
    </aside>
  </section>
  <section id="previewCard" class="preview card" hidden>
    <div><h3>本次录音</h3><p id="previewHint">尚未上传，刷新或关闭后清除。</p></div>
    <audio id="preview" controls></audio>
  </section>
</main>
<div id="lyricsOverlay" class="overlay" aria-hidden="true"><div id="overlayLines"></div><span>轻按任意位置返回 K 歌</span></div>
<div id="accountModal" class="dialog-backdrop" hidden>
  <section class="dialog card" role="dialog" aria-modal="true" aria-labelledby="accountTitle">
    <header><h2 id="accountTitle">K歌账号</h2><button id="accountClose" type="button">关闭</button></header>
    <div id="guestAccount">
      <div class="account-tabs"><button id="showLogin" class="selected" type="button">登录</button><button id="showRegister" type="button">注册</button></div>
      <form id="authForm">
        <label>用户名<input id="authUsername" minlength="3" maxlength="32" autocomplete="username" required></label>
        <label>密码<input id="authPassword" type="password" minlength="10" maxlength="128" autocomplete="current-password" required></label>
        <div id="captchaRow" class="captcha-row" hidden><img id="captchaImage" alt="验证码"><input id="captchaValue" maxlength="12" autocomplete="off" placeholder="输入验证码"><button id="captchaRefresh" type="button">换一张</button></div>
        <button id="authSubmit" class="primary" type="submit">登录</button><p id="authMessage" class="status"></p>
      </form>
    </div>
    <div id="profile" hidden>
      <div id="profileSummary"></div>
      <p class="status">录音由 Master Storage Scheduler 自动选择可写存储成员。</p>
      <div class="profile-actions"><button id="uploadFile" type="button">上传已有录音</button><input id="uploadFileInput" type="file" accept="audio/*,.webm,.ogg,.m4a,.mp3,.wav" hidden><button id="logoutAccount" type="button">退出登录</button></div>
      <form id="passwordForm"><input id="currentPassword" type="password" placeholder="当前密码" required><input id="newPassword" type="password" placeholder="新密码，例如 Huawei@123" required><button type="submit">修改密码</button></form>
      <div id="recordingList" class="recording-list"></div>
      <button id="deleteAccount" class="danger" type="button">注销账号并删除全部录音</button>
    </div>
  </section>
</div>
<noscript>当前浏览器必须启用脚本才能使用 K歌。</noscript>
<script>window.frontierCloudStunUrls={{STUN_URLS}};window.frontierCloudWebrtcIntervalMs={{WEBRTC_INTERVAL_MS}};</script>
<script src="{{NETWORK_OBSERVATION_JS_URL}}" defer></script>
<script src="{{KARAOKE_JS_URL}}" defer></script>
<script src="/static/js/karaoke-audio-quality.js" defer></script>
</body>
</html>
