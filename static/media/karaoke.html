<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>车载 K 歌实验</title>
    <link rel="stylesheet" href="{{KARAOKE_CSS_URL}}">
</head>
<body>
<main class="shell">
    <header class="hero">
        <div>
            <a class="back" href="/api/v1/media">← 返回前沿视界</a>
            <h1>车载 K 歌实验</h1>
            <p>探测车机浏览器能否读取内置语音麦克风，并尝试低延迟返听。</p>
        </div>
        <div id="captureState" class="state idle">尚未采集</div>
    </header>

    <section class="warning">
        <strong>请在驻车状态测试。</strong>
        先确认音量表有响应，再打开返听；车内扬声器可能造成啸叫。所有录音只保存在当前网页内存，不会上传服务器。
    </section>

    <section class="panel primary-controls">
        <div class="button-row">
            <button id="startCapture" class="primary">请求内置麦克风</button>
            <button id="stopCapture" disabled>停止采集</button>
            <button id="speakerTest">测试扬声器</button>
            <button id="toggleMonitor" disabled>打开实时返听</button>
        </div>

        <div class="meter-wrap" aria-label="输入音量">
            <div class="meter-label"><span>麦克风输入</span><output id="levelValue">-∞ dB</output></div>
            <div class="meter"><div id="levelBar" class="meter-bar"></div></div>
        </div>

        <label class="range-row" for="monitorGain">
            <span>返听音量</span>
            <input id="monitorGain" type="range" min="0" max="150" value="60" step="1">
            <output id="monitorGainValue">60%</output>
        </label>

        <div class="option-row">
            <label><input id="echoCancellation" type="checkbox" checked> 回声消除</label>
            <label><input id="noiseSuppression" type="checkbox"> 降噪</label>
            <label><input id="autoGainControl" type="checkbox" checked> 自动增益</label>
        </div>
        <p class="hint">修改采集选项后，需要停止并重新请求麦克风。实时返听默认关闭。</p>
    </section>

    <section class="grid">
        <article class="panel">
            <h2>车机能力</h2>
            <dl id="capabilities" class="capabilities"></dl>
        </article>

        <article class="panel">
            <h2>本地短缓存</h2>
            <p>采集期间每 10 秒形成一个内存片段，最多保留最近 3 段。</p>
            <div class="button-row compact">
                <button id="playLatest" disabled>回放最近片段</button>
                <button id="clearClips" disabled>清空缓存</button>
            </div>
            <audio id="clipPlayer" controls preload="metadata"></audio>
            <div id="clipSummary" class="clip-summary">暂无录音片段</div>
        </article>

        <article class="panel accompaniment">
            <h2>伴奏测试</h2>
            <p>可选择本机音频文件；文件只在浏览器本地播放，不会上传。</p>
            <input id="backingFile" type="file" accept="audio/*">
            <audio id="backingPlayer" controls preload="metadata"></audio>
        </article>

        <article class="panel diagnostics-panel">
            <div class="diagnostics-title">
                <h2>诊断记录</h2>
                <button id="copyDiagnostics">复制诊断</button>
            </div>
            <pre id="diagnostics" aria-live="polite"></pre>
        </article>
    </section>
</main>

<script>
window.frontierCloudStunUrls={{STUN_URLS_JSON}};
</script>
<script src="{{KARAOKE_JS_URL}}"></script>
<script src="{{NETWORK_OBSERVATION_JS_URL}}"></script>
</body>
</html>
