<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>前沿娱乐</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
body{min-height:100vh;min-height:100dvh;color:#fff;background:radial-gradient(circle at 50% -20%,#27324a 0,transparent 38%),#0b0e14}
.container{display:grid;width:100%;min-height:100vh;min-height:100dvh;grid-template-rows:auto minmax(0,1fr);gap:clamp(14px,2.2vh,26px);padding:clamp(18px,3vw,44px)}
.brand-main{position:relative;justify-self:center;display:grid;place-items:center;width:clamp(220px,34vw,460px);height:clamp(72px,10vw,132px);overflow:hidden}
.brand-main img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none;filter:drop-shadow(0 10px 28px rgba(83,178,255,.2))}
.card-grid{display:grid;min-height:0;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(14px,2vw,30px)}
.card{position:relative;display:grid;min-width:0;min-height:0;place-items:center;overflow:hidden;color:#fff;text-decoration:none;background:linear-gradient(145deg,rgba(34,45,64,.96),rgba(18,24,35,.98));border:1px solid #33425b;border-radius:clamp(18px,2vw,30px);box-shadow:0 24px 60px rgba(0,0,0,.3);transition:transform .2s,border-color .2s,background .2s,box-shadow .2s}
.card:hover,.card:focus-visible{z-index:1;background:linear-gradient(145deg,#2b3b56,#182335);border-color:#5a86b4;outline:none;transform:translateY(-5px) scale(1.006);box-shadow:0 30px 72px rgba(0,0,0,.36)}
.card-logo{display:block;width:min(72%,680px);max-height:52%;height:auto;object-fit:contain;pointer-events:none;filter:drop-shadow(0 14px 24px rgba(0,0,0,.28));transition:transform .2s,filter .2s}
.card:hover .card-logo,.card:focus-visible .card-logo{transform:scale(1.025);filter:drop-shadow(0 16px 28px rgba(0,0,0,.32)) brightness(1.04)}
.brand-hotspot{position:absolute;top:0;bottom:0;z-index:2;width:50%;display:block;user-select:none;-webkit-user-select:none}
#refreshHotspot{left:0}
#elevateHotspot{right:0}
@media(max-width:560px){.container{gap:12px;padding:14px}.card-grid{gap:10px}.card{border-radius:16px}.brand-main{width:min(76vw,360px);height:clamp(58px,18vw,108px)}.card-logo{width:86%;max-height:42%}}
</style>
</head>
<body>
<main class="container">
    <div class="brand-main" role="img" aria-label="前沿娱乐">
        <img src="/api/v1/media/brand/logo/entertainment" alt="前沿娱乐">
        <span id="refreshHotspot" class="brand-hotspot" aria-hidden="true"></span>
        <span id="elevateHotspot" class="brand-hotspot" aria-hidden="true"></span>
    </div>
    <nav class="card-grid" aria-label="媒体类型">
        <a href="/api/v1/media/music" class="card" aria-label="前沿音乐" data-catalog-prefetch="/api/v1/media/catalog/categories?media_type=music" data-catalog-cache-key="categories:music">
            <img class="card-logo" src="/api/v1/media/brand/logo/music" alt="前沿音乐">
        </a>
        <a href="/api/v1/media/video" class="card" aria-label="前沿媒体" data-catalog-prefetch="/api/v1/media/catalog/categories?media_type=video" data-catalog-cache-key="categories:video">
            <img class="card-logo" src="/api/v1/media/brand/logo/media" alt="前沿媒体">
        </a>
    </nav>
</main>
<script>
window.frontierCloudStunUrls={{STUN_URLS_JSON}};window.frontierCloudWebrtcIntervalMs={{WEBRTC_INTERVAL_MS}};
window.frontierCloudPrefetchAssets={{MEDIA_PREFETCH_ASSETS_JSON}};
function fiveRapidClicks(element,action){let count=0,started=0;element.addEventListener('click',event=>{event.preventDefault();const now=Date.now();if(!started||now-started>1800){count=1;started=now}else count+=1;if(count===5){count=0;started=0;action()}})}
fiveRapidClicks(document.getElementById('refreshHotspot'),()=>location.assign('/api/v1/media/refresh'));
fiveRapidClicks(document.getElementById('elevateHotspot'),async()=>{const token=prompt('请输入 Admin Key:');if(!token)return;const body=new URLSearchParams({token});try{const r=await fetch('/api/v1/media/admin/elevate',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});const d=await r.json();if(!r.ok){const detail=d.detail;throw new Error(detail&&typeof detail==='object'?(detail.message||'登录失败'):(detail||'登录失败'))}location.href=d.redirect}catch(e){alert(e.message)}});
</script><script src="{{MEDIA_BROWSER_JS_URL}}"></script><script src="{{NETWORK_OBSERVATION_JS_URL}}"></script>
</body>
</html>
