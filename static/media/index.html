<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>前沿娱乐</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
body{min-height:100vh;min-height:100dvh;color:#fff;background:radial-gradient(circle at 50% -20%,#27324a 0,transparent 38%),#0b0e14}
.container{display:grid;width:100%;min-height:100vh;min-height:100dvh;grid-template-rows:auto auto 1fr;align-content:start;gap:clamp(16px,2.4vw,34px);padding:clamp(18px,3vw,44px)}
.brand-surface{position:relative;isolation:isolate;display:grid;place-items:center;overflow:hidden;background:#0b1424;border:1px solid rgba(106,143,194,.36);border-radius:clamp(20px,2.2vw,34px);box-shadow:0 24px 68px rgba(0,0,0,.34)}
.brand-surface::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(145deg,rgba(8,14,26,.08),rgba(11,16,29,.22));box-shadow:inset 0 0 0 1px rgba(255,255,255,.025)}
.brand-backdrop,.brand-foreground{display:block;width:100%;height:100%;object-position:center}
.brand-backdrop{position:absolute;inset:-5%;width:110%;height:110%;z-index:0;object-fit:cover;filter:blur(16px) brightness(.6) saturate(1.25);transform:scale(1.06)}
.brand-foreground{position:absolute;inset:0;z-index:1;object-fit:cover;transition:transform .24s ease,filter .24s ease}
.brand-main{justify-self:center;width:min(1080px,94vw);aspect-ratio:3/1}
.brand-main .brand-foreground{object-fit:cover}
.card-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(14px,2vw,30px)}
.card{min-width:0;aspect-ratio:3/1;color:#fff;text-decoration:none;transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease}
.card:hover,.card:focus-visible{z-index:2;border-color:#6f9ed0;outline:none;transform:translateY(-4px);box-shadow:0 30px 78px rgba(0,0,0,.42),0 0 0 1px rgba(93,157,224,.12)}
.card:hover .brand-foreground,.card:focus-visible .brand-foreground{transform:scale(1.018);filter:brightness(1.05)}
.brand-hotspot{position:absolute;top:0;bottom:0;z-index:3;width:50%;display:block;user-select:none;-webkit-user-select:none}
#refreshHotspot{left:0}
#elevateHotspot{right:0}
@media(max-width:760px){.container{gap:14px;padding:14px}.brand-main{width:100%;aspect-ratio:2.75/1}.card-grid{grid-template-columns:1fr}.card{aspect-ratio:2.8/1}.brand-surface{border-radius:20px}}
@media(max-width:420px){.brand-main,.card{aspect-ratio:2.55/1}.brand-backdrop{filter:blur(12px) brightness(.62) saturate(1.2)}}
</style>
</head>
<body>
<main class="container">
    <div class="brand-surface brand-main" role="img" aria-label="前沿娱乐">
        <img class="brand-backdrop" src="/api/v1/media/brand/logo/entertainment" alt="" aria-hidden="true">
        <img class="brand-foreground" src="/api/v1/media/brand/logo/entertainment" alt="前沿娱乐">
        <span id="refreshHotspot" class="brand-hotspot" aria-hidden="true"></span>
        <span id="elevateHotspot" class="brand-hotspot" aria-hidden="true"></span>
    </div>
    <nav class="card-grid" aria-label="媒体类型">
        <a href="/api/v1/media/music" class="brand-surface card" aria-label="前沿音乐" data-catalog-prefetch="/api/v1/media/catalog/categories?media_type=music" data-catalog-cache-key="categories:music">
            <img class="brand-backdrop" src="/api/v1/media/brand/logo/music" alt="" aria-hidden="true">
            <img class="brand-foreground" src="/api/v1/media/brand/logo/music" alt="前沿音乐">
        </a>
        <a href="/api/v1/media/video" class="brand-surface card" aria-label="前沿媒体" data-catalog-prefetch="/api/v1/media/catalog/categories?media_type=video" data-catalog-cache-key="categories:video">
            <img class="brand-backdrop" src="/api/v1/media/brand/logo/media" alt="" aria-hidden="true">
            <img class="brand-foreground" src="/api/v1/media/brand/logo/media" alt="前沿媒体">
        </a>
    </nav>
</main>
<script>
window.frontierCloudStunUrls={{STUN_URLS_JSON}};window.frontierCloudWebrtcIntervalMs={{WEBRTC_INTERVAL_MS}};
window.frontierCloudPrefetchAssets={{MEDIA_PREFETCH_ASSETS_JSON}};
function fiveRapidClicks(element,action){let count=0,started=0;element.addEventListener('click',event=>{event.preventDefault();const now=Date.now();if(!started||now-started>1800){count=1;started=now}else count+=1;if(count===5){count=0;started=0;action()}})}
fiveRapidClicks(document.getElementById('refreshHotspot'),()=>location.assign('/api/v1/media/refresh'));
fiveRapidClicks(document.getElementById('elevateHotspot'),async()=>{const token=prompt('请输入 Admin Key:');if(!token)return;const body=new URLSearchParams({token});try{const r=await fetch('/api/v1/media/admin/elevate',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});const d=await r.json();if(!r.ok){const detail=d.detail;throw new Error(detail&&typeof detail==='object'?(detail.message||'登录失败'):(detail||'登录失败'))}location.href=d.redirect}catch(e){alert(e.message)}});
</script><script src="{{MEDIA_BROWSER_JS_URL}}"></script><script src="{{NETWORK_OBSERVATION_JS_URL}}"></script>
</body>
</html>
