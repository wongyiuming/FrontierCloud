<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>前沿视界</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#121212;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh}.container{text-align:center;max-width:680px;width:92%}h1{font-size:2rem;margin-bottom:2rem}.card-grid{display:flex;gap:20px;justify-content:center}.card{flex:1;background:#1e1e1e;border:1px solid #2d2d2d;border-radius:12px;padding:40px 20px;text-decoration:none;color:#fff;transition:.2s}.card:hover{transform:translateY(-5px);background:#282828}.card-icon{font-size:48px;margin-bottom:12px}.card-title{font-size:1.25rem;font-weight:bold}.elevate{margin-top:18px;background:#242424;border:1px solid #3d3d3d;color:#bbb;border-radius:8px;padding:10px 20px;cursor:pointer}.elevate:hover{color:#fff;background:#303030}
</style>
</head>
<body><div class="container"><h1>前沿视界</h1><div class="card-grid"><a href="/api/v1/media/music" class="card"><div class="card-icon">🎵</div><div class="card-title">前沿音乐</div></a><a href="/api/v1/media/video" class="card"><div class="card-icon">🎬</div><div class="card-title">前沿视讯</div></a></div><button class="elevate" id="elevate">提权</button><a class="elevate" href="/api/v1/media/refresh">↻ 刷新界面</a></div>
<script>
window.frontierCloudStunUrls={{STUN_URLS_JSON}};
const btn=document.getElementById('elevate');
btn.onclick=async()=>{const token=prompt('请输入今日内搭颜色款式:');if(!token)return;const body=new URLSearchParams({token});try{const r=await fetch('/api/v1/media/admin/elevate',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});const d=await r.json();if(!r.ok){const detail=d.detail;throw new Error(detail&&typeof detail==='object'?(detail.message||'提权失败'):(detail||'提权失败'))}location.href=d.redirect}catch(e){alert(e.message)}};
</script><script src="{{NETWORK_OBSERVATION_JS_URL}}"></script></body></html>
