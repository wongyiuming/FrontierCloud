<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>前沿娱乐</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
body{min-height:100vh;min-height:100dvh;color:#fff;background:radial-gradient(circle at 50% -20%,#27324a 0,transparent 38%),#0b0e14}
.container{display:grid;width:100%;min-height:100vh;min-height:100dvh;grid-template-rows:auto minmax(0,1fr) auto;gap:clamp(14px,2.2vh,26px);padding:clamp(18px,3vw,44px)}
.brand{display:inline-block;font-family:"STKaiti","KaiTi","华文楷体","Noto Serif SC",serif;font-style:italic;font-weight:800;letter-spacing:.13em;transform:skewX(-7deg);text-shadow:0 8px 28px rgba(83,178,255,.24)}
h1{justify-self:center;font-size:clamp(2rem,4vw,4rem);line-height:1.1}
.card-grid{display:grid;min-height:0;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(14px,2vw,30px)}
.card{display:grid;min-width:0;min-height:0;place-content:center;place-items:center;gap:clamp(12px,2.5vh,28px);overflow:hidden;color:#fff;text-decoration:none;background:linear-gradient(145deg,rgba(34,45,64,.96),rgba(18,24,35,.98));border:1px solid #33425b;border-radius:clamp(18px,2vw,30px);box-shadow:0 24px 60px rgba(0,0,0,.3);transition:transform .2s,border-color .2s,background .2s}
.card:hover,.card:focus-visible{z-index:1;background:linear-gradient(145deg,#2b3b56,#182335);border-color:#5a86b4;outline:none;transform:translateY(-5px) scale(1.006)}
.card-icon{font-size:clamp(4rem,10vw,9rem);line-height:1;filter:drop-shadow(0 14px 22px rgba(0,0,0,.3))}
.card-title{font-size:clamp(1.9rem,4.5vw,4.8rem);line-height:1.15}
.brand-hotspot{display:inline-block;user-select:none;-webkit-user-select:none}
@media(max-width:560px){.container{gap:12px;padding:14px}.card-grid{gap:10px}.card{border-radius:16px}.card-title{font-size:clamp(1.45rem,8vw,2.2rem)}.card-icon{font-size:clamp(3.5rem,17vw,5.2rem)}h1{font-size:clamp(1.8rem,10vw,2.8rem)}}
</style>
</head>
<body>
<main class="container">
    <h1 class="brand" aria-label="前沿娱乐"><span id="refreshHotspot" class="brand-hotspot">前沿</span><span id="elevateHotspot" class="brand-hotspot">娱乐</span></h1>
    <nav class="card-grid" aria-label="媒体类型">
        <a href="/api/v1/media/music" class="card"><div class="card-icon" aria-hidden="true">🎵</div><div class="card-title brand">前沿音乐</div></a>
        <a href="/api/v1/media/video" class="card"><div class="card-icon" aria-hidden="true">🎬</div><div class="card-title brand">前沿媒体</div></a>
    </nav>
</main>
<script>
window.frontierCloudStunUrls={{STUN_URLS_JSON}};window.frontierCloudWebrtcIntervalMs={{WEBRTC_INTERVAL_MS}};
function fiveRapidClicks(element,action){let count=0,last=0;element.addEventListener('click',event=>{event.preventDefault();const now=Date.now();count=now-last<=650?count+1:1;last=now;if(count===5){count=0;last=0;action()}})}
fiveRapidClicks(document.getElementById('refreshHotspot'),()=>location.assign('/api/v1/media/refresh'));
fiveRapidClicks(document.getElementById('elevateHotspot'),async()=>{const token=prompt('请输入 Admin Key:');if(!token)return;const body=new URLSearchParams({token});try{const r=await fetch('/api/v1/media/admin/elevate',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});const d=await r.json();if(!r.ok){const detail=d.detail;throw new Error(detail&&typeof detail==='object'?(detail.message||'登录失败'):(detail||'登录失败'))}location.href=d.redirect}catch(e){alert(e.message)}});
</script><script src="{{NETWORK_OBSERVATION_JS_URL}}"></script>
</body>
</html>
