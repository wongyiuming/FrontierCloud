<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>前沿视界</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#121212;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh}.container{text-align:center;max-width:680px;width:92%}h1{font-size:2rem;margin-bottom:2rem}.card-grid{display:flex;gap:20px;justify-content:center}.card{flex:1;background:#1e1e1e;border:1px solid #2d2d2d;border-radius:12px;padding:40px 20px;text-decoration:none;color:#fff;transition:.2s}.card:hover{transform:translateY(-5px);background:#282828}.card-icon{font-size:48px;margin-bottom:12px}.card-title{font-size:1.25rem;font-weight:bold}.elevate{margin-top:18px;background:#242424;border:1px solid #3d3d3d;color:#bbb;border-radius:8px;padding:10px 20px;cursor:pointer}.elevate:hover{color:#fff;background:#303030}.media-search{display:flex;gap:8px;margin:22px 0 10px}.media-search input{min-width:0;flex:1;padding:12px 14px;color:#fff;background:#191919;border:1px solid #3b3b3b;border-radius:8px;font-size:15px}.media-search .elevate{margin-top:0}.search-results{display:flex;max-height:42vh;flex-direction:column;gap:7px;overflow-y:auto;text-align:left}.search-result{display:block;padding:10px 12px;color:#eee;text-decoration:none;background:#1b1b1b;border:1px solid #303030;border-radius:8px}.search-result:hover{background:#272727}.search-title{display:block;font-weight:700}.search-path{display:block;margin-top:4px;overflow-wrap:anywhere;color:#8e9baa;font-size:12px}.search-empty{padding:12px;color:#777;text-align:center}
</style>
</head>
<body><div class="container"><h1>前沿视界</h1><div class="card-grid"><a href="/api/v1/media/music" class="card"><div class="card-icon">🎵</div><div class="card-title">前沿音乐</div></a><a href="/api/v1/media/video" class="card"><div class="card-icon">🎬</div><div class="card-title">前沿视讯</div></a></div><form id="mediaSearchForm" class="media-search"><input id="mediaSearch" type="search" maxlength="100" autocomplete="off" placeholder="搜索曲目、路径或拼音"><button type="submit" class="elevate">搜索</button></form><div id="searchResults" class="search-results" aria-live="polite"></div><button class="elevate" id="elevate">提权</button><a class="elevate" href="/api/v1/media/refresh">↻ 刷新界面</a></div>
<script>
window.frontierCloudStunUrls={{STUN_URLS_JSON}};window.frontierCloudWebrtcIntervalMs={{WEBRTC_INTERVAL_MS}};
const btn=document.getElementById('elevate');
btn.onclick=async()=>{const token=prompt('请输入 Admin Key:');if(!token)return;const body=new URLSearchParams({token});try{const r=await fetch('/api/v1/media/admin/elevate',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});const d=await r.json();if(!r.ok){const detail=d.detail;throw new Error(detail&&typeof detail==='object'?(detail.message||'登录失败'):(detail||'登录失败'))}location.href=d.redirect}catch(e){alert(e.message)}};
const searchInput=document.getElementById('mediaSearch');const searchResults=document.getElementById('searchResults');let searchTimer=null;let searchRequest=null;
const escapeSearchValue=value=>String(value).replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
async function runMediaSearch(){const query=searchInput.value.trim();if(searchRequest)searchRequest.abort();if(!query){searchResults.innerHTML='';return}searchRequest=new AbortController();try{const response=await fetch(`/api/v1/media/search?q=${encodeURIComponent(query)}`,{signal:searchRequest.signal});const data=await response.json();if(!response.ok)throw new Error(data.detail||'搜索失败');searchResults.innerHTML=data.results.length?data.results.map(item=>`<a class="search-result" href="${escapeSearchValue(item.open_url)}"><span class="search-title">${item.type==='audio'?'🎵':'🎬'} ${escapeSearchValue(item.title)}</span><small class="search-path">媒体路径 ${escapeSearchValue(item.display_path)}</small></a>`).join(''):'<div class="search-empty">没有匹配的媒体</div>'}catch(error){if(error.name!=='AbortError')searchResults.innerHTML=`<div class="search-empty">${escapeSearchValue(error.message)}</div>`}}
document.getElementById('mediaSearchForm').onsubmit=event=>{event.preventDefault();runMediaSearch()};searchInput.oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(runMediaSearch,220)};
</script><script src="{{NETWORK_OBSERVATION_JS_URL}}"></script></body></html>
