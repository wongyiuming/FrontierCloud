<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>匿名即焚墙</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #0f172a; color: #e2e8f0; font-family: system-ui, sans-serif; padding: 16px; }
        main { width: min(100%, 576px); margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        h1 { color: #f97316; font-size: 24px; margin: 0; }
        .ttl { background: #1e293b; border-radius: 6px; font-size: 12px; padding: 8px; }
        .composer { border-bottom: 1px solid #334155; margin-bottom: 32px; padding-bottom: 24px; }
        textarea { width: 100%; min-height: 100px; resize: vertical; background: #1e293b; border: 1px solid #334155; border-radius: 8px; color: inherit; padding: 12px; }
        button { width: 100%; margin-top: 8px; border: 0; border-radius: 8px; background: #ea580c; color: #fff; cursor: pointer; font-weight: 700; padding: 10px; }
        button:hover { background: #f97316; }
        #list { display: grid; gap: 16px; }
        .post { background: #1e293b; border-left: 4px solid #f97316; border-radius: 8px; padding: 16px; }
        .content { font-size: 18px; margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
        .meta { display: flex; justify-content: space-between; color: #64748b; font-size: 10px; margin-top: 12px; }
    </style>
</head>
<body>
    <main>
        <header>
            <h1>🔥 阅后即焚墙</h1>
            <span class="ttl">TTL: 240s</span>
        </header>

        <section class="composer">
            <textarea id="ipt" maxlength="2000" placeholder="写点什么..."></textarea>
            <button id="sendButton" type="button">发射</button>
        </section>

        <div id="list"></div>
    </main>

    <script>
        function postElement(post) {
            const card = document.createElement('article');
            card.className = 'post';

            const content = document.createElement('p');
            content.className = 'content';
            content.textContent = String(post.content ?? '');

            const meta = document.createElement('div');
            meta.className = 'meta';
            const created = document.createElement('span');
            created.textContent = new Date(post.created_at).toLocaleString();
            const countdown = document.createElement('span');
            countdown.textContent = '倒计时: 自动销毁中';
            meta.append(created, countdown);
            card.append(content, meta);
            return card;
        }

        async function refresh() {
            const res = await fetch('/api/v1/wall/list');
            const data = await res.json();
            const list = document.getElementById('list');
            list.replaceChildren(...data.map(postElement));
        }

        async function send() {
            const content = document.getElementById('ipt').value;
            if(!content) return;
            const res = await fetch(`/api/v1/wall/publish?content=${encodeURIComponent(content)}`, {method:'POST'});
            if(res.ok) {
                document.getElementById('ipt').value = '';
                refresh();
            } else {
                const err = await res.json();
                alert(err.detail || "操作太快了");
            }
        }

        document.getElementById('sendButton').addEventListener('click', send);
        setInterval(refresh, 10000);
        refresh();
    </script>
</body>
</html>
