<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <title>FrontierCloud · 匿名即焚墙</title>
    <link rel="stylesheet" href="/static/css/wall.css">
</head>
<body>
    <main class="shell">
        <header class="topbar">
            <div><p class="eyebrow">FRONTIERCLOUD / EPHEMERAL</p><h1>匿名即焚墙</h1></div>
            <button id="identityButton" class="identity" type="button" aria-label="更换匿名身份">
                <span id="identitySymbol" class="identity-symbol">?</span><span id="identityName">选择身份</span>
            </button>
        </header>

        <section class="notice" aria-label="隐私说明">
            <span class="notice-dot" aria-hidden="true"></span>
            <p>内容在本机加密。选择一条消息后，必须双指持续按住才能揭示；首次揭示即永久焚毁。</p>
        </section>

        <section class="composer panel" aria-labelledby="composeTitle">
            <div class="section-heading">
                <div><p class="section-kicker">NEW SIGNAL</p><h2 id="composeTitle">投递一条密文</h2></div>
                <span id="sessionClock" class="clock">--:--</span>
            </div>
            <div class="mode-switch" role="tablist" aria-label="消息类型">
                <button id="textModeButton" class="mode active" type="button" role="tab" aria-selected="true">文字 / 表情</button>
                <button id="imageModeButton" class="mode" type="button" role="tab" aria-selected="false">单张图片</button>
            </div>
            <div id="textComposer" class="compose-pane">
                <label class="sr-only" for="messageInput">匿名消息</label>
                <textarea id="messageInput" maxlength="2000" placeholder="写下短暂存在的内容……"></textarea>
                <div class="emoji-row" aria-label="快捷表情">
                    <button type="button" data-emoji="🙂">🙂</button><button type="button" data-emoji="🫠">🫠</button>
                    <button type="button" data-emoji="✨">✨</button><button type="button" data-emoji="🌙">🌙</button>
                    <button type="button" data-emoji="🐧">🐧</button><span id="textCounter">0 / 2000</span>
                </div>
            </div>
            <div id="imageComposer" class="compose-pane hidden">
                <label class="image-drop" for="imageInput">
                    <span class="image-icon">▧</span><strong>选择一张图片</strong>
                    <small>JPEG / PNG / WebP，最大 20 MB；发送前在本机清除元数据</small>
                    <span id="imageName">尚未选择</span>
                </label>
                <input id="imageInput" type="file" accept="image/jpeg,image/png,image/webp" hidden>
            </div>
            <button id="sendButton" class="primary" type="button">加密并投递</button>
            <p id="composerStatus" class="status" role="status" aria-live="polite"></p>
        </section>

        <section class="feed" aria-labelledby="feedTitle">
            <div class="section-heading feed-heading">
                <div><p class="section-kicker">SEALED SIGNALS</p><h2 id="feedTitle">待揭示内容</h2></div>
                <button id="refreshButton" class="ghost" type="button">刷新</button>
            </div>
            <p id="emptyState" class="empty hidden">目前没有仍可揭示的消息。</p>
            <div id="messageList" class="message-list"></div>
        </section>
    </main>

    <aside id="revealDock" class="reveal-dock" aria-live="polite">
        <div id="revealContent" class="reveal-content">
            <span class="finger-mark" aria-hidden="true">◌ ◌</span>
            <strong id="revealTitle">先选择一条消息</strong>
            <span id="revealHint">然后用双指持续按住这里</span>
        </div>
    </aside>

    <div id="avatarModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="avatarTitle">
        <section class="modal-card">
            <p class="section-kicker">15 MINUTE IDENTITY</p><h2 id="avatarTitle">选择本次匿名头像</h2>
            <p>身份只绑定当前浏览器会话，15 分钟后自动失效。</p>
            <div id="avatarGrid" class="avatar-grid"></div>
        </section>
    </div>
    <script src="/static/js/wall.js" defer></script>
</body>
</html>
