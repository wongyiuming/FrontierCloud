[project]
name = "office-automation"
version = "1.1.0"
description = "FrontierCloud media management service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.139.2",
    "starlette==1.3.1",
    "uvicorn[standard]",
    "python-multipart",
    "pydantic-settings",
    "redis",
    "sqlalchemy>=2.0,<3.0",
    "asyncmy>=0.2.10,<1.0",
    "cryptography",
    "prometheus-client>=0.23,<1.0",
    "zipstream-ng==1.9.2",
]

[project.optional-dependencies]
tools = ["yt-dlp[default]"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

