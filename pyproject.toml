[project]
name = "office-automation"
version = "1.1.0"
description = "FrontierCloud media management service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.139.2",
    "starlette==1.3.1",
    "uvicorn[standard]==0.52.4",
    "python-multipart==0.0.32",
    "pydantic-settings==2.15.0",
    "redis==8.1.0",
    "sqlalchemy==2.0.52",
    "asyncmy==0.2.14",
    "cryptography==50.0.1",
    "prometheus-client==0.26.0",
    "zipstream-ng==1.9.2",
    "opencc==1.4.2",
    "pypinyin==0.55.0",
]

[project.optional-dependencies]
tools = ["yt-dlp[default]"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

