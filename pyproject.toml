[project]
name = "frontiercloud-test-tools"
version = "1.2.0rc0"
description = "Test and script drivers for the native FrontierCloud Gin service; not a Web runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
operator = ["httpx>=0.28,<1"]
browser = ["playwright>=1.55,<2"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scripts*", "tests*"]
exclude = ["app*", "updater*"]

