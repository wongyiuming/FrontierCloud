name: Browser UI Regression

permissions:
  contents: read

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

jobs:
  browser-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare disposable UI fixture
        run: |
          mkdir -p certs data/media/music/ui-regression
          : > certs/fullchain.pem
          : > certs/privkey.pem
          cat <<'EOF' > .env
          TLS_ENABLED=false
          INSTANCE_NAME=frontiercloud-ui-regression
          PUBLIC_BIND_ADDRESS=0.0.0.0
          HTTP_PORT=18080
          HTTPS_PORT=18443
          EOF
          python3 - <<'PY'
          import math
          import struct
          import wave
          from pathlib import Path

          target = Path("data/media/music/ui-regression/fixture.wav")
          with wave.open(str(target), "wb") as output:
              output.setparams((1, 2, 8000, 0, "NONE", "not compressed"))
              frames = b"".join(
                  struct.pack("<h", int(2500 * math.sin(2 * math.pi * 440 * index / 8000)))
                  for index in range(8000 * 3)
              )
              output.writeframes(frames)
          PY

      - name: Install browser test dependency
        run: |
          python3 -m venv /tmp/frontiercloud-ui-regression
          /tmp/frontiercloud-ui-regression/bin/pip install playwright==1.62.0
          test -x /usr/bin/google-chrome

      - name: Start real application stack
        run: docker compose up -d --build --remove-orphans --wait --wait-timeout 180

      - name: Run Chromium UI regression
        env:
          BASE_URL: http://127.0.0.1:18080
          PLAYWRIGHT_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: |
          ADMIN_KEY=$(docker compose exec -T web sh -c 'cat /run/frontiercloud-secrets/admin_key')
          export ADMIN_KEY
          /tmp/frontiercloud-ui-regression/bin/python tests/browser_ui_regression.py

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=120 web nginx

      - name: Stop and clean UI fixture
        if: always()
        run: |
          sudo rm -f data/.frontiercloud-maintenance
          docker compose down --volumes --remove-orphans
