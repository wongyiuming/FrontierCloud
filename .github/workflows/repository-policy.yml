name: Repository Policy

permissions:
  contents: read

on:
  create:
  pull_request:
    branches: ["main", "gin_main"]
    types: [opened, synchronize, reopened, edited, ready_for_review]

jobs:
  branch-creation-policy:
    if: ${{ github.event_name == 'create' && github.ref_type == 'branch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Reject non-canonical branch creation
        env:
          CREATED_REF: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CREATED_REF" != "dev" && "$CREATED_REF" != "main" && "$CREATED_REF" != "gin_dev" && "$CREATED_REF" != "gin_main" ]]; then
            echo "::error::new branches are prohibited outside the authorized dev/main and gin_dev/gin_main profiles (created: $CREATED_REF)"
            exit 1
          fi
          echo "Canonical branch event: $CREATED_REF"

  main-pr-topology:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Enforce same-repository runtime-specific promotion
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        shell: bash
        run: |
          set -euo pipefail
          case "$BASE_REF" in
            main) expected_source=dev ;;
            gin_main) expected_source=gin_dev ;;
            *) echo "::error::unexpected production profile '$BASE_REF'"; exit 1 ;;
          esac
          if [[ "$HEAD_REF" != "$expected_source" || "$HEAD_REPO" != "$BASE_REPO" ]]; then
            echo "::error::only same-repository dev -> main or gin_dev -> gin_main promotion PRs are valid; got $HEAD_REPO:$HEAD_REF -> $BASE_REPO:$BASE_REF"
            exit 1
          fi
          echo "Valid release topology: $HEAD_REPO:$HEAD_REF -> $BASE_REPO:$BASE_REF"
