name: One-shot P0 workflow generator

permissions:
  contents: write

on:
  push:
    branches: ["dev"]
    paths: [".github/workflows/p0-generate-workflow.yml"]

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Generate merge-method agnostic workflow blob
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/docker.yml')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  """            const parents = Array.isArray(mainCommit.data.parents) ? mainCommit.data.parents : [];
            const sourceSha = parents[1]?.sha || '';
            if (!/^[0-9a-f]{40}$/.test(sourceSha)) {
              core.setFailed(`main ${context.sha} is not a reviewed dev merge commit`);
              return;
            }
""",
                  """            const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner,
              repo,
              commit_sha: context.sha,
              per_page: 100,
            });
            const promotionPulls = (Array.isArray(associated.data) ? associated.data : []).filter(pr =>
              pr?.merged_at &&
              pr?.base?.ref === 'main' &&
              pr?.head?.ref === 'dev' &&
              pr?.head?.repo?.full_name === `${owner}/${repo}` &&
              /^[0-9a-f]{40}$/.test(pr?.head?.sha || '')
            );
            const sourceShas = [...new Set(promotionPulls.map(pr => pr.head.sha))];
            if (sourceShas.length !== 1) {
              core.setFailed(`main ${context.sha} has no unique merged dev->main PR association`);
              return;
            }
            const sourceSha = sourceShas[0];
""",
              ),
              (
                  "              core.setFailed(`main tree ${mainTree} differs from merged dev tree ${sourceTree}`);\n",
                  "              core.setFailed(`main tree ${mainTree} differs from reviewed dev PR tree ${sourceTree}`);\n",
              ),
              (
                  "              core.setFailed(`merged dev ${sourceSha} has no dev push CI run`);\n",
                  "              core.setFailed(`reviewed dev PR head ${sourceSha} has no dev push CI run`);\n",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'workflow replacement expected once, found {count}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          target = Path('p0/docker.yml.generated')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(text, encoding='utf-8')
          PY
          python3 scripts/check_release_policy.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add p0/docker.yml.generated
          git commit -m "chore: generate final P0 workflow blob"
          git push origin HEAD:dev
