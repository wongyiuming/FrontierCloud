name: Build and Test Docker Compose

permissions:
  contents: read

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["main"]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

jobs:
  test-cluster:
    if: github.event_name != 'pull_request' || github.head_ref != 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: ${{ github.workflow }}-cluster-${{ github.event_name }}-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install isolated cluster test dependencies
        run: |
          python3 -m venv /tmp/frontiercloud-cluster-test
          /tmp/frontiercloud-cluster-test/bin/pip install httpx==0.28.1 playwright==1.62.0
          test -x /usr/bin/google-chrome
          command -v tc
      - name: Build the same application for every node
        run: |
          docker build -t frontiercloud-acceptance-web .
          docker build -t frontiercloud-acceptance-nginx -f nginx/Dockerfile .
          docker build -t frontiercloud-updater -f updater/Dockerfile .
      - name: Run verified local HTTPS topology and browser acceptance
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: /tmp/frontiercloud-cluster-test/bin/python tests/federation_stack.py --output /tmp/federation-acceptance.json
      - name: Keep acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: federation-acceptance
          path: /tmp/federation-acceptance.json

  test-compose:
    if: github.event_name != 'pull_request' || github.head_ref != 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: ${{ github.workflow }}-compose-${{ github.event_name }}-${{ github.head_ref || github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare CI certificates and configuration
        run: |
          mkdir -p certs data/media/music/ci-multiple
          sudo chown -R 10001:10001 data
          openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
            -keyout certs/privkey.pem \
            -out certs/fullchain.pem \
            -subj "/CN=ci.frontiercloud.local" \
            -addext "subjectAltName=DNS:ci.frontiercloud.local,DNS:nginx" \
            -addext "basicConstraints=critical,CA:TRUE"
          sudo cp certs/fullchain.pem /usr/local/share/ca-certificates/frontiercloud-ci.crt
          sudo update-ca-certificates
          echo '127.0.0.1 ci.frontiercloud.local' | sudo tee -a /etc/hosts
          cat <<'EOF' > .env
          TLS_ENABLED=true
          INSTANCE_NAME=frontiercloud-ci
          SERVER_NAME=ci.frontiercloud.local
          EOF

      - name: Validate configuration and frontend syntax
        run: |
          python3 scripts/validate_env_contract.py
          python3 scripts/check_release_policy.py
          docker compose config --quiet
          python3 scripts/check_english_comments.py
          node --check static/js/admin.js
          node --check static/js/player.js
          node --check static/js/media-browser.js
          node --check static/js/nodes.js
          node --check static/js/lyrics.js
          node --check static/js/karaoke.js
          node tests/admin_ui_smoke.mjs
          node tests/player_cache_smoke.mjs

      - name: Build and start services
        run: docker compose up -d --build --remove-orphans --wait --wait-timeout 180

      - name: Run source configuration tests
        run: |
          python3 -m unittest -v tests/test_deployment_contract.py tests/test_federation_contract.py

      - name: Run unit and runtime tests
        run: |
          mapfile -t runtime_tests < <(
            find tests -maxdepth 1 -type f -name 'test_*.py' \
              ! -name 'test_deployment_contract.py' \
              ! -name 'test_federation_contract.py' \
              -printf '/app/%p\n' | sort
          )
          docker compose exec -T web python -m unittest -v "${runtime_tests[@]}"
          docker compose exec -T nginx nginx -t
          docker compose exec -T redis redis-cli ping | grep PONG
          docker compose exec -T mysql sh -c 'MYSQL_PWD=$(cat /run/frontiercloud-secrets/mysql_password) mysqladmin ping -h 127.0.0.1 -umedia_admin --silent'

      - name: Test IP summaries and edge enforcement against the running stack
        run: |
          docker compose exec -T web python -m tests.security_mysql_smoke
          docker compose exec -T web python -m tests.sql_concurrency_smoke
          python3 tests/security_stack_smoke.py

      - name: Test public and admin flows
        run: |
          curl -fsSL https://ci.frontiercloud.local/ | grep "前沿娱乐"
          curl -fsSL https://ci.frontiercloud.local/karaoke/ | grep "K歌"
          curl -fsSL https://ci.frontiercloud.local/karaoke/ | grep '/static/js/karaoke.js?v='
          curl -fsSI https://ci.frontiercloud.local/karaoke/ | grep -qi 'permissions-policy: camera=(), microphone=(self), geolocation=()'
          curl -fsSI 'https://ci.frontiercloud.local/static/js/karaoke.js?v=0000000000000000' | tr -d '\r' | grep -qi '^cache-control: public, max-age=31536000, immutable$'
          curl -fsSI 'https://ci.frontiercloud.local/static/js/player.js?v=0000000000000000' | tr -d '\r' | grep -qi '^cache-control: public, max-age=31536000, immutable$'
          curl -fsSI 'https://ci.frontiercloud.local/static/js/player.js' | tr -d '\r' | grep -qi '^cache-control: no-cache$'
          curl -fsS https://ci.frontiercloud.local/health/live | grep '"status":"healthy"'
          curl -fsS https://ci.frontiercloud.local/health/ready | grep '"status":"ready"'
          generated_metrics_token=$(docker compose exec -T web sh -c 'cat /run/frontiercloud-secrets/metrics_token')
          curl -fsS https://ci.frontiercloud.local/metrics \
            -H "Authorization: Bearer $generated_metrics_token" | grep 'frontiercloud_http_requests_total'
          curl -fsS https://ci.frontiercloud.local/api/v1/media/ | grep "前沿娱乐"
          test "$(curl -sS -o /dev/null -w '%{http_code}' https://ci.frontiercloud.local/api/v1/media/admin/)" = 401

          ADMIN_KEY=$(docker compose exec -T web python -c "from app.core.config import ADMIN_KEY_FILE; print(ADMIN_KEY_FILE.read_text().strip())")
          curl -fsS -c /tmp/admin-cookies.txt -X POST https://ci.frontiercloud.local/api/v1/media/admin/elevate \
            --data-urlencode "token=$ADMIN_KEY" | grep '"status":"ok"'
          CSRF_TOKEN=$(awk '$6 == "__Host-admin-csrf" {print $7}' /tmp/admin-cookies.txt)

          printf 'RIFF0000WAVEfmt ' > /tmp/ci-one.wav
          printf 'RIFF1111WAVEfmt ' > /tmp/ci-two.wav
          curl -fsS -b /tmp/admin-cookies.txt -H "X-CSRF-Token: $CSRF_TOKEN" \
            -F 'target_dir=' -F 'relative_path=music/ci-folder/one.wav' -F 'file=@/tmp/ci-one.wav;type=audio/wav' \
            https://ci.frontiercloud.local/api/v1/media/admin/upload/item | grep 'music/ci-folder/one.wav'
          curl -fsS -b /tmp/admin-cookies.txt -H "X-CSRF-Token: $CSRF_TOKEN" \
            -F 'target_dir=music/ci-multiple' -F 'file=@/tmp/ci-one.wav;type=audio/wav' \
            https://ci.frontiercloud.local/api/v1/media/admin/upload/item | grep 'music/ci-multiple/ci-one.wav'
          curl -fsS -b /tmp/admin-cookies.txt -H "X-CSRF-Token: $CSRF_TOKEN" \
            -F 'target_dir=music/ci-multiple' -F 'file=@/tmp/ci-two.wav;type=audio/wav' \
            https://ci.frontiercloud.local/api/v1/media/admin/upload/item | grep 'music/ci-multiple/ci-two.wav'
          curl -fsS -b /tmp/admin-cookies.txt \
            'https://ci.frontiercloud.local/api/v1/media/admin/download?paths=%5B%22music%2Fci-multiple%2Fci-one.wav%22%5D' \
            -o /tmp/ci-downloaded.wav
          cmp /tmp/ci-one.wav /tmp/ci-downloaded.wav
          test "$(docker compose exec -T redis redis-cli GET media:catalog:v2:generation)" -ge 3
          curl -fsS 'https://ci.frontiercloud.local/api/v1/media/music/category?path=music%2Fci-folder' | grep 'frontierCloudPlayerCatalog'
          curl -fsS 'https://ci.frontiercloud.local/api/v1/media/catalog/media?media_type=music&path=music%2Fci-folder&playback_session_id=ci' | grep 'one'
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            https://ci.frontiercloud.local/api/v1/media/preference)" = 404
          curl -fsS -b /tmp/admin-cookies.txt \
            'https://ci.frontiercloud.local/api/v1/media/admin/media-priority?media_type=audio&path=music%2Fci-folder' | grep 'music/ci-folder/one.wav'
          curl -fsS -b /tmp/admin-cookies.txt -H "X-CSRF-Token: $CSRF_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"media_path":"music/ci-folder/one.wav","value":123}' \
            https://ci.frontiercloud.local/api/v1/media/admin/media-priority | grep '"preference":123'
          curl -fsS -D /tmp/media-headers.txt \
            'https://ci.frontiercloud.local/api/v1/media/stream?file_path=music%2Fci-folder%2Fone.wav' \
            -o /tmp/ci-streamed.wav
          cmp /tmp/ci-one.wav /tmp/ci-streamed.wav
          grep -qi '^cache-control: public, max-age=86400' /tmp/media-headers.txt
          test "$(grep -ci '^cache-control:' /tmp/media-headers.txt)" = 1
          grep -qi '^x-content-type-options: nosniff' /tmp/media-headers.txt
          grep -qi '^strict-transport-security: max-age=31536000' /tmp/media-headers.txt
          test "$(curl -sS -H 'Range: bytes=0-3' -o /tmp/ci-range.bin -w '%{http_code}' \
            'https://ci.frontiercloud.local/api/v1/media/stream?file_path=music%2Fci-folder%2Fone.wav')" = 206
          test "$(wc -c < /tmp/ci-range.bin)" = 4
          head -c 70000 /dev/zero > /tmp/oversized-body.bin
          test "$(curl -sS -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
            --data-binary @/tmp/oversized-body.bin \
            https://ci.frontiercloud.local/api/v1/media/network-observation)" = 413
          printf '[00:01.00]测试歌词第一行\n[00:05.25]测试歌词第二行\n' > /tmp/ci-lyrics.lrc
          curl -fsS -b /tmp/admin-cookies.txt -H "X-CSRF-Token: $CSRF_TOKEN" \
            -F 'file=@/tmp/ci-lyrics.lrc;type=text/plain' \
            https://ci.frontiercloud.local/api/v1/media/admin/upload/lyric | grep 'lyrics/ci-lyrics.lrc'
          curl -fsS -b /tmp/admin-cookies.txt -H "X-CSRF-Token: $CSRF_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"origin_kind":"track","origin_path":"music/ci-folder/one.wav","linked_paths":["lyrics/ci-lyrics.lrc"]}' \
            https://ci.frontiercloud.local/api/v1/media/admin/lyrics/relations | grep '"relations":1'
          curl -fsS -b /tmp/admin-cookies.txt \
            https://ci.frontiercloud.local/api/v1/media/admin/lyrics/catalog | grep 'lyrics/ci-lyrics.lrc'
          curl -fsSG --data-urlencode 'track=music/ci-folder/one.wav' \
            https://ci.frontiercloud.local/api/v1/media/lyrics | grep '测试歌词第一行'
          curl -fsSG --data-urlencode 'track=music/ci-folder/one.wav' \
            https://ci.frontiercloud.local/api/v1/media/lyrics/content | grep '测试歌词第二行'
          docker compose exec -T redis redis-cli --scan \
            --pattern 'media:catalog:v2:*:tracks-v2:*' | grep 'media:catalog:v2:'
          curl -fsS -b /tmp/admin-cookies.txt -H "X-CSRF-Token: $CSRF_TOKEN" \
            -H 'Content-Type: application/json' -d '{"mode":"random"}' \
            https://ci.frontiercloud.local/api/v1/media/admin/key/rotate | grep '"admin_key"'

          for attempt in $(seq 1 6); do
            docker compose exec -T web python -c \
              "import asyncio; from app.services.ip_security import record_invalid_api; asyncio.run(record_invalid_api('203.0.113.77','GET','/etc/passwd','ci-scanner'))"
          done
          docker compose exec -T redis redis-cli GET security:auto-ban:203.0.113.77 | grep '203.0.113.77'
          curl -fsS -b /tmp/admin-cookies.txt \
            https://ci.frontiercloud.local/api/v1/media/admin/security/blocks | grep '203.0.113.77'
          curl -fsS -b /tmp/admin-cookies.txt -H "X-CSRF-Token: $CSRF_TOKEN" \
            -H 'Content-Type: application/json' -d '{"ip":"203.0.113.77"}' \
            https://ci.frontiercloud.local/api/v1/media/admin/security/unban | grep '"status":"ok"'
          test -z "$(docker compose exec -T redis redis-cli GET security:auto-ban:203.0.113.77)"
          curl -fsS -b /tmp/admin-cookies.txt -H "X-CSRF-Token: $CSRF_TOKEN" \
            -H 'Content-Type: application/json' -d '{"ip":"203.0.113.77","note":"CI"}' \
            https://ci.frontiercloud.local/api/v1/media/admin/security/whitelist | grep '"status":"ok"'
          docker compose exec -T redis redis-cli SISMEMBER security:ip-whitelist 203.0.113.77 | grep '^1$'
          curl -fsS -b /tmp/admin-cookies.txt -H "X-CSRF-Token: $CSRF_TOKEN" \
            -H 'Content-Type: application/json' -d '{"ip":"203.0.113.77"}' \
            https://ci.frontiercloud.local/api/v1/media/admin/security/whitelist/remove | grep '"status":"ok"'

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop and clean CI services
        if: always()
        run: docker compose down --volumes --remove-orphans
