name: Build and Test Docker Compose

permissions:
  contents: read
  deployments: write

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["main"]

jobs:
  test-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare CI certificates and environment
        run: |
          mkdir -p certs data/media/music/ci-multiple
          sudo chown -R 10001:10001 data
          openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
            -keyout certs/privkey.pem \
            -out certs/fullchain.pem \
            -subj "/C=CN/ST=CI/L=CI/O=FrontierCloud/CN=localhost"
          cat <<'EOF' > .env
          ENVIRONMENT=test
          COMPOSE_PROFILES=monitoring
          REDIS_URL=redis://redis:6379/0
          ADMIN_BOOTSTRAP_TOKEN=ci_admin_bootstrap_token_please_do_not_use_in_production
          MYSQL_URL=mysql+asyncmy://media_admin:ci_mysql_password@mysql:3306/office_automation
          ADMIN_TOKEN_TTL=900
          ADMIN_TOKEN_ISSUE_INTERVAL=900
          ADMIN_SESSION_TTL=900
          ADMIN_MAX_FAILED_ATTEMPTS_PER_IP=10
          ADMIN_FAILED_WINDOW=300
          ADMIN_MAX_UPLOAD_FILE_SIZE=838860800
          ADMIN_MAX_UPLOAD_TASK_FILES=5000
          ADMIN_MAX_BATCH_FILES=200
          ADMIN_MAX_DOWNLOAD_ITEMS=100
          ADMIN_MAX_FILENAME_LENGTH=240
          MEDIA_MAX_DEPTH=32
          MEDIA_CATALOG_CACHE_TTL=300
          TRUSTED_PROXY_NETWORKS=172.16.0.0/12
          SECURITY_EXEMPT_NETWORKS=127.0.0.0/8,::1/128
          SECURITY_INVALID_API_LIMIT=5
          SECURITY_INVALID_API_WINDOW=3600
          SECURITY_AUTO_BAN_TTL=86400
          SECURITY_RECENT_BAN_HOURS=24
          ADMIN_COOKIE_SECURE=true
          ADMIN_COOKIE_SAMESITE=strict
          ADMIN_COOKIE_NAME=__Host-admin_session
          ADMIN_CSRF_COOKIE_NAME=__Host-admin-csrf
          MYSQL_DATABASE=office_automation
          MYSQL_USER=media_admin
          MYSQL_PASSWORD=ci_mysql_password
          MYSQL_ROOT_PASSWORD=ci_mysql_root_password
          INTERNAL_METRICS_TOKEN=ci_internal_metrics_token_0123456789abcdef
          MONITORING_ALLOW_CIDR=192.0.2.1/32
          METRICS_BASIC_USER=ci_frontiercloud_monitor
          METRICS_BASIC_PASSWORD=ci_metrics_password_0123456789abcdef
          MYSQL_EXPORTER_PASSWORD=ci_exporter_password_0123456789abcdef
          MYSQL_BACKUP_PASSWORD=ci_backup_password_0123456789abcdef
          WEBRTC_STUN_HOST=localhost
          WEBRTC_STUN_PORT=3478
          WEBRTC_STUN_URLS=stun:localhost:3478
          SERVER_NAME=localhost
          HTTP_PORT=80
          HTTPS_PORT=443
          SSL_CERT_PATH=./certs/fullchain.pem
          SSL_KEY_PATH=./certs/privkey.pem
          EOF

      - name: Validate configuration and frontend syntax
        run: |
          docker compose config --quiet
          MONITORING_SERVER_NAME=localhost \
            PRODUCTION_METRICS_HOST=production.example.com \
            PREPRODUCTION_METRICS_HOST=preproduction.example.com \
            REPORT_PRODUCTION_ACCESS_LOG_URL=https://production.example.com/internal/report/access-log \
            REPORT_PREPRODUCTION_ACCESS_LOG_URL=https://preproduction.example.com/internal/report/access-log \
            KIBANA_SECURITY_ENCRYPTION_KEY=ci_kibana_security_encryption_key_123 \
            KIBANA_SAVED_OBJECTS_ENCRYPTION_KEY=ci_kibana_objects_encryption_key_1234 \
            KIBANA_REPORTING_ENCRYPTION_KEY=ci_kibana_reporting_encryption_key_123 \
            docker compose -f monitoring/docker-compose.yaml config --quiet
          docker build --file monitoring/reporting/Dockerfile \
            --tag frontiercloud-weekly-reporter:ci .
          python3 scripts/check_english_comments.py
          node --check static/js/admin.js
          node --check static/js/player.js
          node tests/admin_ui_smoke.mjs

      - name: Build and start services
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Run source configuration tests
        run: |
          python3 -m unittest -v \
            tests/test_development_deployment.py \
            tests/test_exporter_config.py \
            tests/test_monitoring_stack.py

      - name: Run unit and runtime tests
        run: |
          mapfile -t runtime_tests < <(
            find tests -maxdepth 1 -type f -name 'test_*.py' \
              ! -name 'test_exporter_config.py' \
              ! -name 'test_development_deployment.py' \
              ! -name 'test_monitoring_stack.py' \
              -printf '/app/%p\n' | sort
          )
          docker compose exec -T web python -m unittest -v "${runtime_tests[@]}"
          docker compose exec -T nginx nginx -t
          docker compose exec -T redis redis-cli ping | grep PONG
          docker compose exec -T mysql mysqladmin ping -h 127.0.0.1 -umedia_admin -pci_mysql_password --silent

      - name: Test production-like collection agents
        run: |
          docker compose logs nginx | grep 'selected production configuration for ENVIRONMENT=test'
          docker compose ps -a mysql_monitoring_init | grep 'Exited (0)'
          docker compose ps mysql_backup | grep 'Up'
          docker compose exec -T web python - <<'PY'
          import time
          from urllib.request import urlopen

          targets = {
              "node_exporter": ("http://node_exporter:9100/metrics", "node_exporter_build_info"),
              "cadvisor": ("http://cadvisor:8080/metrics", "container_last_seen"),
              "redis_exporter": ("http://redis_exporter:9121/metrics", "redis_up 1"),
              "mysql_exporter": ("http://mysql_exporter:9104/metrics", "mysql_up 1"),
              "nginx_exporter": ("http://nginx_exporter:9113/metrics", "nginx_up 1"),
              "nginxlog_exporter": ("http://nginxlog_exporter:4040/metrics", "# HELP"),
              "mysql_backup": ("http://node_exporter:9100/metrics", "frontiercloud_backup_last_run_success 1"),
          }
          for name, (url, marker) in targets.items():
              error = None
              for _ in range(30):
                  try:
                      payload = urlopen(url, timeout=3).read().decode("utf-8", "replace")
                      if marker in payload:
                          break
                      error = f"missing marker {marker!r}"
                  except Exception as exc:
                      error = str(exc)
                  time.sleep(1)
              else:
                  raise AssertionError(f"{name} is not scrapeable: {error}")
              print(f"{name}=ok")
          PY

      - name: Test public and admin flows
        run: |
          curl -kfsSL https://localhost/ | grep "前沿视界"
          curl -kfsS https://localhost/api/v1/health | grep '"status":"healthy"'
          curl -kfsS https://localhost/api/v1/media/ | grep "前沿视界"
          test "$(curl -ksS -o /dev/null -w '%{http_code}' https://localhost/api/v1/media/admin/)" = 401

          TOKEN_RESPONSE=$(curl -kfsS -X POST https://localhost/api/v1/media/admin/token/issue \
            -H 'X-Token: ci_admin_bootstrap_token_please_do_not_use_in_production')
          ADMIN_TOKEN=$(python -c 'import json,sys; print(json.load(sys.stdin)["token"])' <<<"$TOKEN_RESPONSE")
          curl -kfsS -c /tmp/admin-cookies.txt -X POST https://localhost/api/v1/media/admin/elevate \
            --data-urlencode "token=$ADMIN_TOKEN" | grep '"status":"ok"'
          CSRF_TOKEN=$(awk '$6 == "__Host-admin-csrf" {print $7}' /tmp/admin-cookies.txt)

          printf 'RIFF0000WAVEfmt ' > /tmp/ci-one.wav
          printf 'RIFF1111WAVEfmt ' > /tmp/ci-two.wav
          curl -kfsS -b /tmp/admin-cookies.txt -H "X-CSRF-Token: $CSRF_TOKEN" \
            -F 'target_dir=' -F 'relative_path=music/ci-folder/one.wav' -F 'file=@/tmp/ci-one.wav;type=audio/wav' \
            https://localhost/api/v1/media/admin/upload/item | grep 'music/ci-folder/one.wav'
          curl -kfsS -b /tmp/admin-cookies.txt -H "X-CSRF-Token: $CSRF_TOKEN" \
            -F 'target_dir=music/ci-multiple' -F 'file=@/tmp/ci-one.wav;type=audio/wav' \
            https://localhost/api/v1/media/admin/upload/item | grep 'music/ci-multiple/ci-one.wav'
          curl -kfsS -b /tmp/admin-cookies.txt -H "X-CSRF-Token: $CSRF_TOKEN" \
            -F 'target_dir=music/ci-multiple' -F 'file=@/tmp/ci-two.wav;type=audio/wav' \
            https://localhost/api/v1/media/admin/upload/item | grep 'music/ci-multiple/ci-two.wav'
          curl -kfsS -b /tmp/admin-cookies.txt \
            'https://localhost/api/v1/media/admin/download?paths=%5B%22music%2Fci-multiple%2Fci-one.wav%22%5D' \
            -o /tmp/ci-downloaded.wav
          cmp /tmp/ci-one.wav /tmp/ci-downloaded.wav
          test "$(docker compose exec -T redis redis-cli GET media:catalog:v2:generation)" -ge 3
          curl -kfsS 'https://localhost/api/v1/media/music/category?path=music%2Fci-folder' | grep 'one'
          docker compose exec -T redis redis-cli --scan \
            --pattern 'media:catalog:v2:*:tracks:*' | grep 'media:catalog:v2:'
          curl -kfsS -b /tmp/admin-cookies.txt \
            'https://localhost/api/v1/media/admin/logs?after=0&limit=20' | grep '"secure_transport":true'

          for attempt in $(seq 1 6); do
            docker compose exec -T web python -c \
              "import asyncio; from app.services.ip_security import record_invalid_api; asyncio.run(record_invalid_api('203.0.113.77','GET','/etc/passwd','ci-scanner'))"
          done
          docker compose exec -T redis redis-cli GET security:auto-ban:203.0.113.77 | grep '203.0.113.77'
          curl -kfsS -b /tmp/admin-cookies.txt \
            https://localhost/api/v1/media/admin/security/blocks | grep '203.0.113.77'
          curl -kfsS -b /tmp/admin-cookies.txt -H "X-CSRF-Token: $CSRF_TOKEN" \
            -H 'Content-Type: application/json' -d '{"ip":"203.0.113.77"}' \
            https://localhost/api/v1/media/admin/security/unban | grep '"status":"ok"'
          test -z "$(docker compose exec -T redis redis-cli GET security:auto-ban:203.0.113.77)"
          curl -kfsS -b /tmp/admin-cookies.txt -H "X-CSRF-Token: $CSRF_TOKEN" \
            -H 'Content-Type: application/json' -d '{"ip":"203.0.113.77","note":"CI"}' \
            https://localhost/api/v1/media/admin/security/whitelist | grep '"status":"ok"'
          docker compose exec -T redis redis-cli SISMEMBER security:ip-whitelist 203.0.113.77 | grep '^1$'
          curl -kfsS -b /tmp/admin-cookies.txt -H "X-CSRF-Token: $CSRF_TOKEN" \
            -H 'Content-Type: application/json' -d '{"ip":"203.0.113.77"}' \
            https://localhost/api/v1/media/admin/security/whitelist/remove | grep '"status":"ok"'

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop and clean CI services
        if: always()
        run: docker compose down --volumes --remove-orphans

  deploy-rn:
    name: deploy-rn
    needs: test-compose
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev' &&
      github.repository == 'wongyiuming/FrontierCloud'
    runs-on: [self-hosted, Linux, X64, rn-preproduction]
    timeout-minutes: 20
    concurrency:
      group: rn-preproduction
      cancel-in-progress: false
    environment:
      name: rn-preproduction
    env:
      RN_DEPLOY_PATH: ${{ vars.RN_DEPLOY_PATH }}
    steps:
      - name: Verify immutable deployment boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/dev
          test "$GITHUB_REPOSITORY" = wongyiuming/FrontierCloud
          test -n "$RN_DEPLOY_PATH"
          test -d "$RN_DEPLOY_PATH/.git"

      - name: Fast-forward RN to the tested dev commit
        shell: bash
        run: |
          set -euo pipefail
          cd "$RN_DEPLOY_PATH"
          test "$(git branch --show-current)" = dev
          test -z "$(git status --porcelain --untracked-files=no)"
          git fetch --no-tags origin dev
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git merge --ff-only "$GITHUB_SHA"
          sh scripts/deploy_rn.sh
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
