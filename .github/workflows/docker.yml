name: Build and Test Python Source

on:
  push:
    branches: [dev, main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  source:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: python-source-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bounded source policy and JavaScript smoke checks
        run: timeout --signal=TERM --kill-after=5s 150s bash scripts/test-ci-source.sh

  test-compose:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: python-compose-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'
      - name: Compose configuration only; no containers or native acceptance
        run: timeout --signal=TERM --kill-after=5s 150s python -m tests.compose_layout_native

  topology:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require the canonical promotion pair
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== 'pull_request') return;
            const p = context.payload.pull_request;
            if (p.base.ref !== 'main' || p.head.ref !== 'dev' || p.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed('Only same-repository dev -> main promotion is allowed');
            }

  promote-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Promote already-tested dev commit
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const mainCommit = await github.rest.repos.getCommit({
              owner,
              repo,
              ref: context.sha,
            });
            const mainTree = mainCommit.data.commit.tree.sha;
            const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner,
              repo,
              commit_sha: context.sha,
              per_page: 100,
            });
            const promotionPulls = (Array.isArray(associated.data) ? associated.data : []).filter(pr =>
              pr?.merged_at &&
              pr?.base?.ref === 'main' &&
              pr?.head?.ref === 'dev' &&
              pr?.head?.repo?.full_name === `${owner}/${repo}` &&
              /^[0-9a-f]{40}$/.test(pr?.head?.sha || '')
            );
            const sourceShas = [...new Set(promotionPulls.map(pr => pr.head.sha))];
            if (sourceShas.length !== 1) {
              core.setFailed(`main ${context.sha} has no unique merged dev->main PR association`);
              return;
            }
            const sourceSha = sourceShas[0];
            const sourceCommit = await github.rest.repos.getCommit({ owner, repo, ref: sourceSha });
            const sourceTree = sourceCommit.data.commit.tree.sha;
            if (sourceTree !== mainTree) {
              core.setFailed(`main tree ${mainTree} differs from reviewed dev PR tree ${sourceTree}`);
              return;
            }
            const response = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'docker.yml',
              event: 'push',
              head_sha: sourceSha,
              per_page: 20,
            });
            const runs = Array.isArray(response.data?.workflow_runs)
              ? response.data.workflow_runs
              : [];
            const matching = runs.filter(item =>
              item?.head_sha === sourceSha &&
              item?.head_branch === 'dev' &&
              item?.event === 'push'
            );
            matching.sort((a, b) => b.run_number - a.run_number || b.run_attempt - a.run_attempt);
            const run = matching[0] || null;
            if (!run) {
              core.setFailed(`reviewed dev PR head ${sourceSha} has no dev push CI run`);
              return;
            }
            if (run.status !== 'completed' || run.conclusion !== 'success') {
              core.setFailed(`dev CI #${run.run_number} for ${sourceSha} is ${run.status}/${run.conclusion || 'unknown'}`);
              return;
            }
            const jobResponse = await github.rest.actions.listJobsForWorkflowRunAttempt({
              owner, repo, run_id: run.id, attempt_number: run.run_attempt, per_page: 100,
            });
            const jobs = Array.isArray(jobResponse.data?.jobs) ? jobResponse.data.jobs : [];
            for (const required of ['source', 'test-compose']) {
              const matches = jobs.filter(item => item.name === required);
              const job = matches[0];
              if (matches.length !== 1 || job.status !== 'completed' || job.conclusion !== 'success' ||
                  job.head_sha !== sourceSha || job.run_id !== run.id) {
                core.setFailed(`dev CI #${run.run_number} has no successful ${required} job for ${sourceSha}`);
                return;
              }
            }
            core.notice(`main ${context.sha} promotes dev ${sourceSha} from CI #${run.run_number}; tree ${mainTree}`);
            core.setOutput('source_sha', sourceSha);
            core.setOutput('run_number', String(run.run_number));
            core.setOutput('tree_sha', mainTree);
