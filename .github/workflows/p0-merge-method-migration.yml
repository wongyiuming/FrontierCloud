name: One-shot P0 merge-method migration

permissions:
  contents: write

on:
  push:
    branches: ["dev"]
    paths: [".github/workflows/p0-merge-method-migration.yml"]

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Make release promotion merge-method agnostic
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          replace(
              "app/services/release_control.py",
              '''RELEASE_BRANCH = "main"
          CI_BRANCH = "dev"
          REPOSITORY_API = "https://api.github.com/repos/wongyiuming/FrontierCloud"
          CI_URL = f"{REPOSITORY_API}/actions/workflows/docker.yml/runs"
          BRANCH_URL = f"{REPOSITORY_API}/branches/{RELEASE_BRANCH}"
          ''',
              '''RELEASE_BRANCH = "main"
          CI_BRANCH = "dev"
          REPOSITORY_FULL_NAME = "wongyiuming/FrontierCloud"
          REPOSITORY_API = f"https://api.github.com/repos/{REPOSITORY_FULL_NAME}"
          CI_URL = f"{REPOSITORY_API}/actions/workflows/docker.yml/runs"
          BRANCH_URL = f"{REPOSITORY_API}/branches/{RELEASE_BRANCH}"
          ''',
          )

          replace(
              "app/services/release_control.py",
              '''def _matching_ci_run(runs: list[dict], source_sha: str) -> dict | None:
              """Return the exact dev push CI run for the commit merged into main."""
              if not SHA_RE.fullmatch(source_sha):
                  return None
              for item in runs:
                  if not isinstance(item, dict):
                      continue
                  if (
                      item.get("head_branch") == CI_BRANCH
                      and item.get("event") == "push"
                      and str(item.get("head_sha") or "") == source_sha
                  ):
                      return item
              return None
          ''',
              '''def _matching_ci_run(runs: list[dict], source_sha: str) -> dict | None:
              """Return the exact dev push CI run for one reviewed PR head commit."""
              if not SHA_RE.fullmatch(source_sha):
                  return None
              for item in runs:
                  if not isinstance(item, dict):
                      continue
                  if (
                      item.get("head_branch") == CI_BRANCH
                      and item.get("event") == "push"
                      and str(item.get("head_sha") or "") == source_sha
                  ):
                      return item
              return None


          def _promotion_source_sha(pulls: list[dict]) -> str:
              """Resolve exactly one merged same-repository dev -> main PR head SHA."""
              matches: set[str] = set()
              for item in pulls:
                  if not isinstance(item, dict) or not item.get("merged_at"):
                      continue
                  base = item.get("base") if isinstance(item.get("base"), dict) else {}
                  head = item.get("head") if isinstance(item.get("head"), dict) else {}
                  head_repo = head.get("repo") if isinstance(head.get("repo"), dict) else {}
                  source_sha = str(head.get("sha") or "")
                  if (
                      base.get("ref") == RELEASE_BRANCH
                      and head.get("ref") == CI_BRANCH
                      and head_repo.get("full_name") == REPOSITORY_FULL_NAME
                      and SHA_RE.fullmatch(source_sha)
                  ):
                      matches.add(source_sha)
              return next(iter(matches)) if len(matches) == 1 else ""
          ''',
          )

          replace(
              "app/services/release_control.py",
              '''                parents = main_commit.get("parents") if isinstance(main_commit.get("parents"), list) else []
                          source_parent = parents[1] if len(parents) > 1 and isinstance(parents[1], dict) else {}
                          source_sha = str(source_parent.get("sha") or "")
          ''',
              '''                source_sha = ""
                          if SHA_RE.fullmatch(main_sha):
                              pulls_response = await client.get(f"{REPOSITORY_API}/commits/{main_sha}/pulls")
                              pulls_response.raise_for_status()
                              pulls_payload = pulls_response.json()
                              pulls = pulls_payload if isinstance(pulls_payload, list) else []
                              source_sha = _promotion_source_sha(pulls)
          ''',
          )

          replace(
              "app/services/release_control.py",
              '''                        "detail": "main HEAD is not a reviewed dev merge commit",
          ''',
              '''                        "detail": "main HEAD has no unique merged dev->main PR association",
          ''',
          )
          replace(
              "app/services/release_control.py",
              '''                            "detail": "main HEAD tree differs from the merged dev tree",
          ''',
              '''                            "detail": "main HEAD tree differs from the reviewed dev PR tree",
          ''',
          )
          replace(
              "app/services/release_control.py",
              '''                            "detail": "merged dev commit has no matching dev push CI result",
          ''',
              '''                            "detail": "reviewed dev PR head has no matching dev push CI result",
          ''',
          )
          replace(
              "app/services/release_control.py",
              '''                            detail = "dev CI for the merged commit is still running"
          ''',
              '''                            detail = "dev CI for the reviewed PR head is still running"
          ''',
          )
          replace(
              "app/services/release_control.py",
              '''                            detail = f"dev CI for the merged commit failed ({run.get('conclusion') or 'unknown'})"
          ''',
              '''                            detail = f"dev CI for the reviewed PR head failed ({run.get('conclusion') or 'unknown'})"
          ''',
          )

          replace(
              ".github/workflows/docker.yml",
              '''            const parents = Array.isArray(mainCommit.data.parents) ? mainCommit.data.parents : [];
                      const sourceSha = parents[1]?.sha || '';
                      if (!/^[0-9a-f]{40}$/.test(sourceSha)) {
                        core.setFailed(`main ${context.sha} is not a reviewed dev merge commit`);
                        return;
                      }
          ''',
              '''            const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                        owner,
                        repo,
                        commit_sha: context.sha,
                        per_page: 100,
                      });
                      const promotionPulls = (Array.isArray(associated.data) ? associated.data : []).filter(pr =>
                        pr?.merged_at &&
                        pr?.base?.ref === 'main' &&
                        pr?.head?.ref === 'dev' &&
                        pr?.head?.repo?.full_name === `${owner}/${repo}` &&
                        /^[0-9a-f]{40}$/.test(pr?.head?.sha || '')
                      );
                      const sourceShas = [...new Set(promotionPulls.map(pr => pr.head.sha))];
                      if (sourceShas.length !== 1) {
                        core.setFailed(`main ${context.sha} has no unique merged dev->main PR association`);
                        return;
                      }
                      const sourceSha = sourceShas[0];
          ''',
          )
          replace(
              ".github/workflows/docker.yml",
              '''              core.setFailed(`main tree ${mainTree} differs from merged dev tree ${sourceTree}`);
          ''',
              '''              core.setFailed(`main tree ${mainTree} differs from reviewed dev PR tree ${sourceTree}`);
          ''',
          )
          replace(
              ".github/workflows/docker.yml",
              '''              core.setFailed(`merged dev ${sourceSha} has no dev push CI run`);
          ''',
              '''              core.setFailed(`reviewed dev PR head ${sourceSha} has no dev push CI run`);
          ''',
          )

          replace(
              "scripts/check_release_policy.py",
              '''require('main_commit.get("parents")' in release and 'parents[1]' in release,
                  "Web release control must derive the exact dev commit merged into main")
          require('\"head_sha\": source_sha' in release and '_matching_ci_run(runs, source_sha)' in release,
                  "Web release control must query the exact merged dev SHA")
          require('source_tree != main_tree' in release,
                  "Web release control must reject a main tree that differs from the merged dev tree")
          ''',
              '''require('REPOSITORY_FULL_NAME = "wongyiuming/FrontierCloud"' in release,
                  "Web release control must bind promotion provenance to this repository")
          require('f"{REPOSITORY_API}/commits/{main_sha}/pulls"' in release and '_promotion_source_sha(pulls)' in release,
                  "Web release control must resolve the reviewed PR associated with main HEAD")
          require('base.get("ref") == RELEASE_BRANCH' in release and 'head.get("ref") == CI_BRANCH' in release
                  and 'head_repo.get("full_name") == REPOSITORY_FULL_NAME' in release,
                  "Web release control must require a merged same-repository dev-to-main PR")
          require('\"head_sha\": source_sha' in release and '_matching_ci_run(runs, source_sha)' in release,
                  "Web release control must query the exact reviewed dev PR head SHA")
          require('source_tree != main_tree' in release,
                  "Web release control must reject a main tree that differs from the reviewed dev PR tree")
          ''',
          )
          replace(
              "scripts/check_release_policy.py",
              '''require('actions/github-script@v7' in workflow and 'mainCommit.data.parents' in workflow,
                  "Main promotion must derive the exact merged dev commit")
          require('parents[1]?.sha' in workflow and 'sourceTree !== mainTree' in workflow,
                  "Main promotion must verify that the merged dev tree equals the main tree")
          require('head_sha: sourceSha' in workflow and 'item?.head_sha === sourceSha' in workflow,
                  "Main promotion must query the exact merged dev SHA instead of scanning historical trees")
          ''',
              '''require('actions/github-script@v7' in workflow and 'listPullRequestsAssociatedWithCommit' in workflow,
                  "Main promotion must resolve the reviewed PR associated with main HEAD")
          require("pr?.base?.ref === 'main'" in workflow and "pr?.head?.ref === 'dev'" in workflow
                  and 'pr?.head?.repo?.full_name === `${owner}/${repo}`' in workflow,
                  "Main promotion must require a merged same-repository dev-to-main PR")
          require('sourceTree !== mainTree' in workflow,
                  "Main promotion must verify that the reviewed dev PR tree equals the main tree")
          require('head_sha: sourceSha' in workflow and 'item?.head_sha === sourceSha' in workflow,
                  "Main promotion must query the exact reviewed dev PR head SHA")
          require('mainCommit.data.parents' not in workflow and 'parents[1]' not in release,
                  "Production promotion must not depend on the GitHub merge method")
          ''',
          )
          replace(
              "scripts/check_release_policy.py",
              '''print("Release policy contract passed: main promotes an already-tested dev commit")
          ''',
              '''print("Release policy contract passed: main promotes an already-tested reviewed dev PR tree")
          ''',
          )

          replace(
              "tests/test_release_control_regression.py",
              '''class FakeResponse:
              def __init__(self, payload: dict):
                  self.payload = payload
          ''',
              '''class FakeResponse:
              def __init__(self, payload):
                  self.payload = payload
          ''',
          )
          replace(
              "tests/test_release_control_regression.py",
              '''class FakeClient:
              def __init__(self, *, branch: dict, runs: dict | None = None, source: dict | None = None):
                  self.branch = branch
                  self.runs = runs or {"workflow_runs": []}
                  self.source = source or {}
                  self.requests: list[tuple[str, dict | None]] = []
          ''',
              '''class FakeClient:
              def __init__(self, *, branch: dict, runs: dict | None = None, source: dict | None = None,
                           pulls: list[dict] | None = None):
                  self.branch = branch
                  self.runs = runs or {"workflow_runs": []}
                  self.source = source or {}
                  self.pulls = [promotion_pr()] if pulls is None else pulls
                  self.requests: list[tuple[str, dict | None]] = []
          ''',
          )
          replace(
              "tests/test_release_control_regression.py",
              '''        if url == release_control.CI_URL:
                      return FakeResponse(self.runs)
                  if url == f"{release_control.REPOSITORY_API}/commits/{SOURCE_SHA}":
                      return FakeResponse(self.source)
          ''',
              '''        if url == release_control.CI_URL:
                      return FakeResponse(self.runs)
                  if url == f"{release_control.REPOSITORY_API}/commits/{MAIN_SHA}/pulls":
                      return FakeResponse(self.pulls)
                  if url == f"{release_control.REPOSITORY_API}/commits/{SOURCE_SHA}":
                      return FakeResponse(self.source)
          ''',
          )
          replace(
              "tests/test_release_control_regression.py",
              '''def branch_payload(*, tree: str = TREE_SHA, source: str = SOURCE_SHA) -> dict:
              return {
                  "commit": {
                      "sha": MAIN_SHA,
                      "commit": {"tree": {"sha": tree}},
                      "parents": [{"sha": OLD_SHA}, {"sha": source}],
                  }
              }


          def source_payload(*, tree: str = TREE_SHA) -> dict:
          ''',
              '''def branch_payload(*, tree: str = TREE_SHA) -> dict:
              return {
                  "commit": {
                      "sha": MAIN_SHA,
                      "commit": {"tree": {"sha": tree}},
                      "parents": [{"sha": OLD_SHA}],
                  }
              }


          def promotion_pr(*, source: str = SOURCE_SHA, base: str = "main", head: str = "dev",
                           repo: str = "wongyiuming/FrontierCloud", merged_at: str | None = "2026-09-25T00:00:00Z") -> dict:
              return {
                  "merged_at": merged_at,
                  "base": {"ref": base},
                  "head": {"ref": head, "sha": source, "repo": {"full_name": repo}},
              }


          def source_payload(*, tree: str = TREE_SHA) -> dict:
          ''',
          )
          replace(
              "tests/test_release_control_regression.py",
              '''    async def test_publishable_requires_exact_dev_push_for_second_parent_and_same_tree(self):
          ''',
              '''    async def test_publishable_requires_reviewed_dev_pr_exact_push_and_same_tree(self):
          ''',
          )
          replace(
              "tests/test_release_control_regression.py",
              '''    async def test_non_merge_main_head_is_never_publishable(self):
                  payload = branch_payload(source="")
                  result = await self.run_ci(FakeClient(branch=payload))
                  self.assertFalse(result["publishable"])
                  self.assertIn("not a reviewed dev merge commit", result["detail"])
          ''',
              '''    async def test_main_without_unique_reviewed_dev_pr_is_never_publishable(self):
                  result = await self.run_ci(FakeClient(branch=branch_payload(), pulls=[]))
                  self.assertFalse(result["publishable"])
                  self.assertIn("no unique merged dev->main PR association", result["detail"])

              async def test_merge_method_is_irrelevant_but_pr_provenance_is_strict(self):
                  for pulls in (
                      [promotion_pr(head="feature")],
                      [promotion_pr(repo="example/fork")],
                      [promotion_pr(merged_at=None)],
                      [promotion_pr(), promotion_pr(source="f" * 40)],
                  ):
                      with self.subTest(pulls=pulls):
                          release_control._ci_cache = (0.0, {})
                          result = await self.run_ci(FakeClient(branch=branch_payload(), pulls=pulls))
                          self.assertFalse(result["publishable"])
                          self.assertIn("no unique merged dev->main PR association", result["detail"])
          ''',
          )

          PY

          python3 -m py_compile app/services/release_control.py scripts/check_release_policy.py tests/test_release_control_regression.py
          python3 scripts/check_release_policy.py
          git diff --check

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/services/release_control.py .github/workflows/docker.yml scripts/check_release_policy.py tests/test_release_control_regression.py
          git commit -m "fix: make release promotion merge-method agnostic"
          git push origin HEAD:dev
