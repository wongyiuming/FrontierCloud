name: Publish Project Wiki Once

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/publish-wiki-once.yml
      - .wiki-publish/**

permissions:
  contents: write

jobs:
  publish-wiki:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout current dev documentation source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Publish current Wiki snapshot
        env:
          WIKI_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.wiki.git
        shell: bash
        run: |
          set -euo pipefail
          test -f .wiki-publish/Home.md

          git clone "$WIKI_URL" /tmp/frontiercloud-wiki
          find /tmp/frontiercloud-wiki -maxdepth 1 -type f -name '*.md' -delete
          cp .wiki-publish/*.md /tmp/frontiercloud-wiki/

          cat > /tmp/frontiercloud-wiki/_Sidebar.md <<'EOF'
          - [Home](Home)
          - [Architecture](Architecture)
          - [Deployment and Configuration](Deployment-and-Configuration)
          - [Cluster and Resource Model](Cluster-and-Resource-Model)
          - [Media and Storage Placement](Media-and-Storage)
          - [Operations and Troubleshooting](Operations-and-Troubleshooting)
          - [Release and Database Migrations](Release-and-Database-Migrations)
          - [Engineering and CI](Engineering-and-CI)
          - [Command Reference](Command-Reference)
          EOF

          cd /tmp/frontiercloud-wiki
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A

          if git diff --cached --quiet; then
            echo 'Wiki is already up to date.'
            exit 0
          fi

          git commit -m 'docs: refresh FrontierCloud wiki for current architecture'
          git push origin HEAD
