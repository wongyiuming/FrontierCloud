name: Publish Project Wiki Once

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/publish-wiki-once.yml

permissions:
  contents: write

jobs:
  publish-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main documentation source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Publish docs/wiki into GitHub Wiki
        env:
          GH_TOKEN: ${{ github.token }}
          WIKI_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.wiki.git
        run: |
          set -euo pipefail
          test -d docs/wiki
          test -f docs/wiki/Home.md

          git clone "$WIKI_URL" /tmp/frontiercloud-wiki

          find /tmp/frontiercloud-wiki -maxdepth 1 -type f -name '*.md' -delete
          cp docs/wiki/*.md /tmp/frontiercloud-wiki/

          cd /tmp/frontiercloud-wiki
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A

          if git diff --cached --quiet; then
            echo 'Wiki is already up to date.'
            exit 0
          fi

          git commit -m 'docs: publish FrontierCloud project wiki'
          git push origin HEAD
