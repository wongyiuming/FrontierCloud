name: Runtime and Store Conformance

on:
  push:
    branches: [gin_dev, gin_main, dev, main]
    paths:
      - 'app/**'
      - 'cmd/**'
      - 'internal/**'
      - 'migrations/**'
      - 'protocol/**'
      - 'tests/**'
      - 'scripts/test-store-interop.sh'
      - 'scripts/test-go-business.sh'
      - 'scripts/test-go-deployment.sh'
      - 'scripts/test-go-updater.sh'
      - 'scripts/build-native-images.sh'
      - 'scripts/test-mixed-runtime.sh'
      - 'scripts/test-mixed-release.sh'
      - 'scripts/test-native-default.sh'
      - 'static/**'
      - 'go.mod'
      - 'go.sum'
      - 'pyproject.toml'
      - 'Dockerfile.gin'
      - 'Dockerfile'
      - 'Dockerfile.python'
      - 'updater/Dockerfile.gin'
      - 'nginx/**'
      - 'docker-compose*.yaml'
      - '.env.example'
      - '.github/workflows/runtime-conformance.yml'
  pull_request:
    branches: [gin_dev, gin_main, dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-conformance-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  protocol-and-stores:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Bounded shared schema and protocol asset checks only
        run: timeout --signal=TERM --kill-after=5s 150s python3 scripts/check_ci_assets.py
