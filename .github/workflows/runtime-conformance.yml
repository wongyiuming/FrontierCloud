name: Runtime and Store Conformance

on:
  push:
    branches: [gin_dev, gin_main, dev, main]
    paths:
      - 'app/**'
      - 'cmd/**'
      - 'internal/**'
      - 'migrations/**'
      - 'protocol/**'
      - 'tests/**'
      - 'scripts/test-store-interop.sh'
      - 'scripts/test-go-business.sh'
      - 'scripts/test-go-deployment.sh'
      - 'scripts/test-go-updater.sh'
      - 'static/**'
      - 'go.mod'
      - 'go.sum'
      - 'pyproject.toml'
      - 'Dockerfile.gin'
      - 'updater/Dockerfile.gin'
      - 'nginx/**'
      - 'docker-compose*.yaml'
      - '.env.example'
      - '.github/workflows/runtime-conformance.yml'
  pull_request:
    branches: [gin_dev, gin_main, dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-conformance-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  protocol-and-stores:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify shared protocol and four database combinations
        run: bash scripts/test-store-interop.sh
      - name: Verify real Go business repositories and authentication
        run: bash scripts/test-go-business.sh
