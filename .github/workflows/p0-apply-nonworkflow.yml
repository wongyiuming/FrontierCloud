name: One-shot P0 non-workflow apply

permissions:
  contents: write

on:
  push:
    branches: ["dev"]
    paths: [".github/workflows/p0-apply-nonworkflow.yml"]

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Reuse validated migration and commit non-workflow files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/p0-merge-method-migration.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          body = source.split(marker, 1)[1].split("\n          PY\n", 1)[0]
          code = "\n".join(line[10:] if line.startswith("          ") else line for line in body.splitlines())
          exec(compile(code, '<p0-migration>', 'exec'))
          PY
          python3 -m py_compile app/services/release_control.py scripts/check_release_policy.py tests/test_release_control_regression.py
          python3 scripts/check_release_policy.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/services/release_control.py scripts/check_release_policy.py tests/test_release_control_regression.py
          git commit -m "fix: make release provenance merge-method agnostic"
          git push origin HEAD:dev
