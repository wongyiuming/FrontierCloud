[package]
name = "frontier-karaoke-web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
frontier-karaoke-core = { path = "../frontier-karaoke-core" }
frontier-karaoke-audio = { path = "../frontier-karaoke-audio" }
frontier-karaoke-api-client = { path = "../frontier-karaoke-api-client" }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = [
    "AudioContext", "Blob", "BlobEvent", "CssStyleDeclaration", "Document", "DomTokenList",
    "Element", "Event", "EventTarget", "Headers", "HtmlAudioElement", "HtmlButtonElement",
    "History", "HtmlElement", "HtmlInputElement", "HtmlMediaElement", "HtmlOptionElement", "HtmlSelectElement",
    "HtmlVideoElement", "Location", "MediaDeviceInfo", "MediaDeviceKind", "MediaDevices",
    "MediaRecorder", "MediaStream", "MediaStreamConstraints", "MediaStreamTrack", "MediaTrackSupportedConstraints", "Navigator",
    "Node", "Performance", "Url", "UrlSearchParams", "Window", "console"
] }
