version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = [
    "AudioContext", "AudioDestinationNode", "AudioNode", "AudioParam", "AudioWorklet", "AudioWorkletNode",
    "BiquadFilterNode", "BiquadFilterType", "DynamicsCompressorNode", "GainNode",
    "ChannelMergerNode", "ChannelSplitterNode",
    "HtmlMediaElement", "MediaElementAudioSourceNode", "MediaStream", "MediaStreamAudioDestinationNode",
    "MediaStreamAudioSourceNode", "MessageEvent", "MessagePort", "Worklet"
] }
