[workspace]
members = [
    "crates/frontier-karaoke-core",
    "crates/frontier-karaoke-audio",
    "crates/frontier-karaoke-api-client",
    "crates/frontier-karaoke-web",
    "crates/frontier-karaoke-worklet",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
wasm-bindgen = "=0.2.104"
wasm-bindgen-futures = "0.4.54"
js-sys = "0.3.81"
web-sys = "0.3.81"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "s"
