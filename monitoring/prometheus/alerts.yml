groups:
  - name: frontiercloud-availability
    rules:
      - alert: ExporterDown
        expr: up{job!="blackbox-health"} == 0
        for: 30s
        labels: {severity: critical, service: monitoring}
        annotations:
          summary: "采集目标连续 30 秒不可用"
          description: "{{ $labels.job }} / {{ $labels.instance }} 当前值 {{ $value }}。"

      - alert: FrontierCloudHealthDown
        expr: probe_success{job="blackbox-health"} == 0
        for: 30s
        labels: {severity: critical, service: web}
        annotations:
          summary: "FrontierCloud 健检连续 30 秒失败"
          description: "HTTPS 健检失败，请检查 Nginx、Web 容器与上游依赖。"

      - alert: RedisUnavailable
        expr: redis_up == 0
        for: 1m
        labels: {severity: critical, service: redis}
        annotations:
          summary: "Redis 不可用"
          description: "Redis Exporter 连续一分钟无法访问 Redis。"

      - alert: MySQLUnavailable
        expr: mysql_up == 0
        for: 1m
        labels: {severity: critical, service: mysql}
        annotations:
          summary: "MySQL 不可用"
          description: "MySQL Exporter 连续一分钟无法访问 MySQL。"

  - name: frontiercloud-resources
    rules:
      - alert: HostCPUHigh
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 5m
        labels: {severity: warning, service: host}
        annotations:
          summary: "生产主机 CPU 持续高于 90%"
          description: "当前 CPU 使用率约 {{ $value | printf \"%.1f\" }}%。"

      - alert: HostMemoryHigh
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 5m
        labels: {severity: warning, service: host}
        annotations:
          summary: "生产主机内存持续高于 90%"
          description: "当前内存使用率约 {{ $value | printf \"%.1f\" }}%。"

      - alert: HostDiskLow
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|nsfs"} / node_filesystem_size_bytes * 100 < 8
        for: 2m
        labels: {severity: critical, service: filesystem}
        annotations:
          summary: "生产主机磁盘可用空间低于 8%"
          description: "{{ $labels.mountpoint }} 当前仅余 {{ $value | printf \"%.1f\" }}%。"

      - alert: HostNetworkReceiveHigh
        expr: sum by(instance) (rate(node_network_receive_bytes_total{device!~"lo|veth.*|docker.*|br-.*"}[5m])) > 50000000
        for: 10m
        labels: {severity: warning, service: network}
        annotations:
          summary: "生产主机入站带宽连续 10 分钟超过 50 MB/s"
          description: "当前入站速率约 {{ $value | humanize1024 }}B/s。"

      - alert: HostNetworkTransmitHigh
        expr: sum by(instance) (rate(node_network_transmit_bytes_total{device!~"lo|veth.*|docker.*|br-.*"}[5m])) > 50000000
        for: 10m
        labels: {severity: warning, service: network}
        annotations:
          summary: "生产主机出站带宽连续 10 分钟超过 50 MB/s"
          description: "当前出站速率约 {{ $value | humanize1024 }}B/s。"

  - name: frontiercloud-application
    rules:
      - alert: WebHTTP5xxHigh
        expr: sum(rate(frontiercloud_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(frontiercloud_http_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels: {severity: warning, service: web}
        annotations:
          summary: "Web 5xx 比例持续高于 5%"
          description: "最近五分钟 5xx 比例约 {{ $value | humanizePercentage }}。"

      - alert: WebLatencyHigh
        expr: histogram_quantile(0.95, sum by(le) (rate(frontiercloud_http_request_duration_seconds_bucket[5m]))) > 2
        for: 5m
        labels: {severity: warning, service: web}
        annotations:
          summary: "Web P95 延迟持续超过 2 秒"
          description: "当前 P95 延迟约 {{ $value | printf \"%.2f\" }} 秒。"

      - alert: MySQLBackupFailed
        expr: frontiercloud_backup_last_run_success == 0
        for: 5m
        labels: {severity: critical, service: backup}
        annotations:
          summary: "最近一次 MySQL 备份失败"
          description: "备份任务已连续报告失败超过五分钟。"

      - alert: MySQLBackupStale
        expr: time() - frontiercloud_backup_last_success_timestamp_seconds > 93600
        for: 10m
        labels: {severity: critical, service: backup}
        annotations:
          summary: "MySQL 成功备份已超过 26 小时"
          description: "距最近一次成功备份约 {{ $value | humanizeDuration }}。"
