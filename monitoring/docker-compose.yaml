services:
  prometheus:
    image: prom/prometheus:v3.12.0
    restart: always
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-8d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-3GB}
      - --web.listen-address=0.0.0.0:9090
      - --web.enable-lifecycle
      - --web.external-url=https://${MONITORING_SERVER_NAME:?MONITORING_SERVER_NAME must be set}:${MONITORING_HTTPS_PORT:-8443}/prometheus/
      - --web.config.file=/etc/prometheus/web.yml
    expose:
      - "9090"
    volumes:
      - ${MONITORING_RUNTIME_DIR:-.}/generated/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${MONITORING_RUNTIME_DIR:-.}/generated/prometheus-web.yml:/etc/prometheus/web.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ${MONITORING_RUNTIME_DIR:-.}/secrets/production_metrics_password:/run/secrets/production_metrics_password:ro
      - ${MONITORING_RUNTIME_DIR:-.}/secrets/preproduction_metrics_password:/run/secrets/preproduction_metrics_password:ro
      - ${MONITORING_RUNTIME_DIR:-.}/secrets/monitoring_password:/run/secrets/monitoring_password:ro
      - prometheus_data:/prometheus
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${PROMETHEUS_MEMORY_LIMIT:-768m}
    logging: &monitoring_logging
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    depends_on:
      - alertmanager
      - blackbox
    extra_hosts:
      - "520mall.cc:154.26.176.194"
      - "www4399.sbs:10.77.0.1"

  grafana:
    image: grafana/grafana:13.1.0
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-frontier_admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_HTTP_ADDR: 0.0.0.0
      GF_SERVER_ROOT_URL: https://${MONITORING_SERVER_NAME:?MONITORING_SERVER_NAME must be set}/monitoring/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SECURITY_ENFORCE_DOMAIN: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_HIDE_VERSION: "true"
      GF_AUTH_BASIC_PASSWORD_POLICY: "true"
    expose:
      - "3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ${MONITORING_RUNTIME_DIR:-.}/secrets/grafana_admin_password:/run/secrets/grafana_admin_password:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ${MONITORING_RUNTIME_DIR:-.}/generated/grafana-prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${GRAFANA_MEMORY_LIMIT:-384m}
    logging: *monitoring_logging
    depends_on:
      - prometheus

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.2
    restart: always
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: -Xms768m -Xmx768m
    expose: ["9200"]
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    mem_limit: 1280m
    mem_reservation: 896m
    ulimits:
      memlock: {soft: -1, hard: -1}
    logging: *monitoring_logging

  logstash:
    image: docker.elastic.co/logstash/logstash:9.5.2
    restart: always
    environment:
      LS_JAVA_OPTS: -Xms192m -Xmx192m
      XPACK_MONITORING_ENABLED: "false"
      PIPELINE_WORKERS: "1"
    expose: ["8080"]
    volumes:
      - ./elk/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    mem_limit: 384m
    logging: *monitoring_logging
    depends_on: [elasticsearch]

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.2
    restart: always
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      SERVER_BASEPATH: /elk
      SERVER_REWRITEBASEPATH: "true"
      SERVER_PUBLICBASEURL: https://${MONITORING_SERVER_NAME:?MONITORING_SERVER_NAME must be set}/elk
      XPACK_REPORTING_ENABLED: "false"
      XPACK_FLEET_AGENTS_ENABLED: "false"
      NODE_OPTIONS: --max-old-space-size=768
      XPACK_SECURITY_ENCRYPTIONKEY: ${KIBANA_SECURITY_ENCRYPTION_KEY:?KIBANA_SECURITY_ENCRYPTION_KEY must be set}
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_SAVED_OBJECTS_ENCRYPTION_KEY:?KIBANA_SAVED_OBJECTS_ENCRYPTION_KEY must be set}
      XPACK_REPORTING_ENCRYPTIONKEY: ${KIBANA_REPORTING_ENCRYPTION_KEY:?KIBANA_REPORTING_ENCRYPTION_KEY must be set}
      XPACK_SECURITY_SECURECOOKIES: "true"
    expose: ["5601"]
    mem_limit: 1152m
    logging: *monitoring_logging
    depends_on: [elasticsearch]
    extra_hosts:
      - "520mall.cc:154.26.176.194"
      - "www4399.sbs:10.77.0.1"

  log_collector:
    build:
      context: ..
      dockerfile: monitoring/reporting/Dockerfile
    restart: always
    command: ["python", "elk_collector.py"]
    environment:
      COLLECTOR_DATABASE_PATH: /var/lib/frontiercloud-report/elk-offsets.sqlite3
      LOGSTASH_URL: http://logstash:8080
      REPORT_METRICS_USER: ${METRICS_BASIC_USER:-frontiercloud_monitor}
      PRODUCTION_ACCESS_LOG_URL: ${REPORT_PRODUCTION_ACCESS_LOG_URL:?REPORT_PRODUCTION_ACCESS_LOG_URL must be set}
      PRODUCTION_METRICS_PASSWORD_FILE: /run/secrets/production_metrics_password
      PREPRODUCTION_ACCESS_LOG_URL: ${REPORT_PREPRODUCTION_ACCESS_LOG_URL:?REPORT_PREPRODUCTION_ACCESS_LOG_URL must be set}
      PREPRODUCTION_METRICS_PASSWORD_FILE: /run/secrets/preproduction_metrics_password
    volumes:
      - weekly_report_data:/var/lib/frontiercloud-report
      - ${MONITORING_RUNTIME_DIR:-.}/secrets/production_metrics_password:/run/secrets/production_metrics_password:ro
      - ${MONITORING_RUNTIME_DIR:-.}/secrets/preproduction_metrics_password:/run/secrets/preproduction_metrics_password:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    mem_limit: 128m
    pids_limit: 64
    logging: *monitoring_logging
    depends_on: [logstash]
    extra_hosts:
      - "520mall.cc:154.26.176.194"
      - "www4399.sbs:10.77.0.1"

  alertmanager:
    image: prom/alertmanager:v0.32.1
    restart: always
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=0.0.0.0:9093
      - --web.external-url=https://${MONITORING_SERVER_NAME:?MONITORING_SERVER_NAME must be set}:${MONITORING_HTTPS_PORT:-8443}/alertmanager/
      - --web.route-prefix=/alertmanager
      - --web.config.file=/etc/alertmanager/web.yml
    expose:
      - "9093"
    volumes:
      - ${MONITORING_RUNTIME_DIR:-.}/generated/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ${MONITORING_RUNTIME_DIR:-.}/generated/alertmanager-web.yml:/etc/alertmanager/web.yml:ro
      - ${MONITORING_RUNTIME_DIR:-.}/secrets/tg_bot_token:/run/secrets/tg_bot_token:ro
      - alertmanager_data:/alertmanager
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    logging: *monitoring_logging

  gateway:
    image: nginxinc/nginx-unprivileged:1.26-alpine
    restart: always
    ports:
      - "${MONITORING_BIND_ADDRESS:-127.0.0.1}:${MONITORING_HTTP_PORT:-8080}:8080"
      - "${MONITORING_BIND_ADDRESS:-127.0.0.1}:${MONITORING_HTTPS_PORT:-8443}:8443"
    volumes:
      - ${MONITORING_RUNTIME_DIR:-.}/generated/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${MONITORING_EXTRA_CONFIG_DIR:-./nginx/server.d}:/etc/nginx/server.d:ro
      - ${MONITORING_RUNTIME_DIR:-.}/secrets/tls_fullchain.pem:/run/tls/fullchain.pem:ro
      - ${MONITORING_RUNTIME_DIR:-.}/secrets/tls_privkey.pem:/run/tls/privkey.pem:ro
      - ${MONITORING_RUNTIME_DIR:-.}/secrets/monitoring.htpasswd:/run/secrets/monitoring.htpasswd:ro
      - ${MONITORING_ACME_WEBROOT:-/var/www/certbot}:/var/www/certbot:ro
    read_only: true
    tmpfs:
      - /tmp:size=4m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 64m
    logging: *monitoring_logging
    depends_on:
      - grafana
      - prometheus
      - alertmanager

  blackbox:
    image: prom/blackbox-exporter:v0.28.0
    restart: always
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    expose:
      - "9115"
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    logging: *monitoring_logging
    extra_hosts:
      - "520mall.cc:154.26.176.194"
      - "www4399.sbs:10.77.0.1"

  weekly_reporter:
    profiles: ["reporting"]
    build:
      context: ..
      dockerfile: monitoring/reporting/Dockerfile
    restart: always
    environment:
      REPORT_DATABASE_PATH: /var/lib/frontiercloud-report/report.sqlite3
      REPORT_TIMEZONE: ${REPORT_TIMEZONE:-Asia/Shanghai}
      CITY_DATABASE_PATH: /var/lib/frontiercloud-report/dbip-city-lite.mmdb
      TG_BOT_TOKEN_FILE: /run/secrets/tg_bot_token
      TG_CHAT_ID: ${TG_CHAT_ID:-}
      REPORT_METRICS_USER: ${METRICS_BASIC_USER:-frontiercloud_monitor}
      PRODUCTION_PROMETHEUS_URL: http://prometheus:9090/prometheus
      PRODUCTION_PROMETHEUS_USER: ${MONITORING_BASIC_USER:-frontier_observer}
      PRODUCTION_PROMETHEUS_PASSWORD_FILE: /run/secrets/production_monitoring_password
      PRODUCTION_SECURITY_URL: ${REPORT_PRODUCTION_SECURITY_URL:-}
      PRODUCTION_ACCESS_LOG_URL: ${REPORT_PRODUCTION_ACCESS_LOG_URL:-}
      PRODUCTION_METRICS_PASSWORD_FILE: /run/secrets/production_metrics_password
      PREPRODUCTION_PROMETHEUS_URL: ${REPORT_PREPRODUCTION_PROMETHEUS_URL:-}
      PREPRODUCTION_PROMETHEUS_USER: ${REPORT_PREPRODUCTION_MONITORING_USER:-frontier_observer}
      PREPRODUCTION_PROMETHEUS_PASSWORD_FILE: /run/secrets/preproduction_monitoring_password
      PREPRODUCTION_SECURITY_URL: ${REPORT_PREPRODUCTION_SECURITY_URL:-}
      PREPRODUCTION_ACCESS_LOG_URL: ${REPORT_PREPRODUCTION_ACCESS_LOG_URL:-}
      PREPRODUCTION_METRICS_PASSWORD_FILE: /run/secrets/preproduction_metrics_password
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-wongyiuming/FrontierCloud}
    volumes:
      - weekly_report_data:/var/lib/frontiercloud-report
      - ${MONITORING_RUNTIME_DIR:-.}/secrets/tg_bot_token:/run/secrets/tg_bot_token:ro
      - ${MONITORING_RUNTIME_DIR:-.}/secrets/monitoring_password:/run/secrets/production_monitoring_password:ro
      - ${MONITORING_RUNTIME_DIR:-.}/secrets/production_metrics_password:/run/secrets/production_metrics_password:ro
      - ${MONITORING_RUNTIME_DIR:-.}/secrets/monitoring_password:/run/secrets/preproduction_monitoring_password:ro
      - ${MONITORING_RUNTIME_DIR:-.}/secrets/preproduction_metrics_password:/run/secrets/preproduction_metrics_password:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    pids_limit: 64
    logging: *monitoring_logging
    depends_on:
      - prometheus
    extra_hosts:
      - "520mall.cc:154.26.176.194"
      - "www4399.sbs:10.77.0.1"

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  weekly_report_data:
  elasticsearch_data:
