services:
  prometheus:
    image: prom/prometheus:v3.12.0
    container_name: frontiercloud_prometheus
    restart: always
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
      - --storage.tsdb.retention.size=6GB
      - --web.listen-address=0.0.0.0:9090
      - --web.enable-lifecycle
      - --web.external-url=https://${MONITORING_SERVER_NAME:?MONITORING_SERVER_NAME must be set}:${MONITORING_HTTPS_PORT:-8443}/prometheus/
      - --web.config.file=/etc/prometheus/web.yml
    expose:
      - "9090"
    volumes:
      - ./generated/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./generated/prometheus-web.yml:/etc/prometheus/web.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./secrets/metrics_password:/run/secrets/metrics_password:ro
      - ./secrets/monitoring_password:/run/secrets/monitoring_password:ro
      - prometheus_data:/prometheus
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m
    logging: &monitoring_logging
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    depends_on:
      - alertmanager
      - blackbox

  grafana:
    image: grafana/grafana:13.1.0
    container_name: frontiercloud_grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER must be set}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_HTTP_ADDR: 0.0.0.0
      GF_SERVER_ROOT_URL: https://${MONITORING_SERVER_NAME:?MONITORING_SERVER_NAME must be set}:${MONITORING_HTTPS_PORT:-8443}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SECURITY_ENFORCE_DOMAIN: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_HIDE_VERSION: "true"
      GF_AUTH_BASIC_PASSWORD_POLICY: "true"
    expose:
      - "3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./secrets/grafana_admin_password:/run/secrets/grafana_admin_password:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./generated/grafana-prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 384m
    logging: *monitoring_logging
    depends_on:
      - prometheus

  alertmanager:
    image: prom/alertmanager:v0.32.1
    container_name: frontiercloud_alertmanager
    restart: always
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=0.0.0.0:9093
      - --web.external-url=https://${MONITORING_SERVER_NAME:?MONITORING_SERVER_NAME must be set}:${MONITORING_HTTPS_PORT:-8443}/alertmanager/
      - --web.route-prefix=/alertmanager
      - --web.config.file=/etc/alertmanager/web.yml
    expose:
      - "9093"
    volumes:
      - ./generated/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./generated/alertmanager-web.yml:/etc/alertmanager/web.yml:ro
      - ./secrets/tg_bot_token:/run/secrets/tg_bot_token:ro
      - alertmanager_data:/alertmanager
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    logging: *monitoring_logging

  gateway:
    image: nginxinc/nginx-unprivileged:1.26-alpine
    container_name: frontiercloud_monitoring_gateway
    restart: always
    ports:
      - "${MONITORING_HTTP_PORT:-8080}:8080"
      - "${MONITORING_HTTPS_PORT:-8443}:8443"
    volumes:
      - ./generated/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./secrets/tls_fullchain.pem:/run/tls/fullchain.pem:ro
      - ./secrets/tls_privkey.pem:/run/tls/privkey.pem:ro
      - ${MONITORING_ACME_WEBROOT:?MONITORING_ACME_WEBROOT must be set}:/var/www/certbot:ro
    read_only: true
    tmpfs:
      - /tmp:size=4m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 64m
    logging: *monitoring_logging
    depends_on:
      - grafana
      - prometheus
      - alertmanager

  blackbox:
    image: prom/blackbox-exporter:v0.28.0
    container_name: frontiercloud_blackbox
    restart: always
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    expose:
      - "9115"
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    logging: *monitoring_logging

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
